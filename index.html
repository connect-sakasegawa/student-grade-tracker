        }
        if (c.fac) {
          const list = ucMethodsFor(c.u, c.fac);
          html += `<div class="uc-field"><label>受験する方式と日程</label></div>`;
          if (!c.meths.length) c.meths.push({ m: "", date: "" });
          c.meths.forEach((mm, mi) => {
            const r = list.find((x) => x.method === mm.m) || null;
            if (r && r.ex.length === 1) mm.date = r.ex[0];
            if (r && !r.ex.length) mm.date = "";
            const dateSel = r && r.ex.length > 1
              ? ucSelect(`uc-md-${ci}-${mi}`, "受験日を選ぶ", [["", "選ぶ"], ...r.ex.map((d) => [d, `${d}（${ucWd(d)}）`])], mm.date)
              : ucSelect(`uc-md-${ci}-${mi}`, "試験日", [[mm.date || "", r ? (r.ex.length ? `${r.ex[0]}（${ucWd(r.ex[0])}）` : "共テのみ") : "―"]], mm.date || "", true);
            html += `<div class="uc-meth"><div class="uc-two">${ucSelect(`uc-m-${ci}-${mi}`, "方式", [["", "選んでください"], ...list.map((x) => [x.method, x.method + (x.ct ? "（共テのみ）" : "")])], mm.m)}${dateSel}</div>${r ? `<div class="uc-mres">合格発表 ${r.res ? `${r.res}（${ucWd(r.res)}）` : "未定"}${r.chk ? " ※要項で確認" : ""}</div>${r.note ? `<div class="uc-sub" style="margin:2px 0 0;">${ucEsc(r.note)}</div>` : ""}` : ""}${c.meths.length > 1 ? `<button type="button" class="uc-mini" data-ucmdel="${ci}-${mi}">この方式を外す</button>` : ""}</div>`;
          });
          html += `<button type="button" class="uc-add" data-ucmadd="${ci}">＋ 方式を追加</button>`;
        }
      }
      if (c.u) {
        html += `<div class="uc-field" style="margin-top:10px;"><label>受験科目（タップで選ぶ）</label><div class="uc-subj">${UC_SUBJ.map((s) => `<button type="button" data-ucsubj="${ci}" data-s="${s}" class="${(c.subj || []).includes(s) ? "on" : ""}" aria-pressed="${(c.subj || []).includes(s)}">${s}</button>`).join("")}</div></div>`;
      }
      html += `<button type="button" class="uc-save" data-ucsave="1" style="margin-top:12px;">保存する</button></div>`;
    });
    if (cards.length < UC_MAX_CARDS) html += `<button type="button" class="uc-add" id="uc-add-card">＋ 志望校を追加</button><div style="height:12px"></div>`;
    const hist = (ucShibo && ucShibo.history) || [];
    html += `<div class="card" style="margin-top:14px;"><p class="section-title" style="margin-top:0;">変更履歴</p>${hist.length ? hist.map((h) => `<div class="uc-hist"><b>${ucEsc(h.savedAtLabel || "")}</b><div>${ucEsc(h.summary || "")}</div></div>`).join("") : `<p class="uc-sub" style="margin:0;">保存すると、ここに記録が残ります。</p>`}</div>`;
    body.innerHTML = html;
    ucBindForm();
  }
  function ucBindForm() {
    const cards = ucForm.cards;
    const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach((el) => el.addEventListener(ev, fn));
    cards.forEach((c, ci) => {
      const g = (id) => document.getElementById(id);
      if (g(`uc-u-${ci}`)) g(`uc-u-${ci}`).addEventListener("change", (e) => { const keepSubj = c.subj; Object.assign(c, ucNewCard(), { u: e.target.value, subj: keepSubj }); ucRenderForm(); });
      if (g(`uc-f-${ci}`)) g(`uc-f-${ci}`).addEventListener("change", (e) => { c.fac = e.target.value; c.dept = ""; c.deptFree = ""; c.meths = []; ucRenderForm(); });
      if (g(`uc-d-${ci}`)) g(`uc-d-${ci}`).addEventListener("change", (e) => { c.dept = e.target.value; ucRenderForm(); });
      [["uc-ff2-", "facFree"], ["uc-df2-", "deptFree"], ["uc-df-", "deptFree"]].forEach(([p, k]) => { if (g(p + ci)) g(p + ci).addEventListener("input", (e) => { c[k] = e.target.value; }); });
      [["uc-fn-", "name"], ["uc-ff-", "fac"], ["uc-fd-", "dept"], ["uc-fm-", "method"]].forEach(([p, k]) => { if (g(p + ci)) g(p + ci).addEventListener("input", (e) => { c.free[k] = e.target.value; }); });
      [["uc-fx-", "date"], ["uc-fr-", "res"]].forEach(([p, k]) => { if (g(p + ci)) g(p + ci).addEventListener("change", (e) => { c.free[k] = e.target.value; ucRenderForm(); }); });
      (c.meths || []).forEach((mm, mi) => {
        if (g(`uc-m-${ci}-${mi}`)) g(`uc-m-${ci}-${mi}`).addEventListener("change", (e) => { mm.m = e.target.value; mm.date = ""; ucRenderForm(); });
        if (g(`uc-md-${ci}-${mi}`)) g(`uc-md-${ci}-${mi}`).addEventListener("change", (e) => { mm.date = e.target.value; ucRenderForm(); });
      });
    });
    on("[data-ucup]", "click", (e) => { const i = Number(e.currentTarget.dataset.ucup); [cards[i - 1], cards[i]] = [cards[i], cards[i - 1]]; ucRenderForm(); });
    on("[data-ucdel]", "click", (e) => { cards.splice(Number(e.currentTarget.dataset.ucdel), 1); if (!cards.length) cards.push(ucNewCard()); ucRenderForm(); });
    on("[data-ucmadd]", "click", (e) => { cards[Number(e.currentTarget.dataset.ucmadd)].meths.push({ m: "", date: "" }); ucRenderForm(); });
    on("[data-ucmdel]", "click", (e) => { const [ci, mi] = e.currentTarget.dataset.ucmdel.split("-").map(Number); cards[ci].meths.splice(mi, 1); ucRenderForm(); });
    on("[data-ucsubj]", "click", (e) => { const c = cards[Number(e.currentTarget.dataset.ucsubj)], s = e.currentTarget.dataset.s; c.subj = (c.subj || []).includes(s) ? c.subj.filter((x) => x !== s) : [...(c.subj || []), s]; e.currentTarget.classList.toggle("on"); e.currentTarget.setAttribute("aria-pressed", String(c.subj.includes(s))); });
    on("[data-ucct]", "click", (e) => { ucForm.ct.take = e.currentTarget.dataset.ucct; ucRenderForm(); });
    on("[data-ucctsubj]", "click", (e) => { const ct = ucForm.ct, sj = e.currentTarget.dataset.ucctsubj; ct.subj = (ct.subj || []).includes(sj) ? ct.subj.filter((x) => x !== sj) : [...(ct.subj || []), sj]; e.currentTarget.classList.toggle("on"); e.currentTarget.setAttribute("aria-pressed", String(ct.subj.includes(sj))); });
    const add = document.getElementById("uc-add-card");
    if (add) add.addEventListener("click", () => { cards.push(ucNewCard()); ucRenderForm(); });
    on("[data-ucsave]", "click", ucSaveShibo);
    const calBtn = document.getElementById("uc-open-cal");
    if (calBtn) calBtn.addEventListener("click", ucOpenCalendarStudent);
  }
  function ucCleanCards(cards) {
    return cards.filter((c) => c.u && (c.u !== UC_OTHER || (c.free && c.free.name))).map((c) => {
      const out = { u: c.u, subj: (c.subj || []).slice(0, 20) };
      if (c.u === UC_OTHER) { const f = c.free || {}; out.free = { name: f.name || "", fac: f.fac || "", dept: f.dept || "", method: f.method || "", date: f.date || "", res: f.res || "" }; }
      else { out.fac = c.fac || ""; out.facFree = c.fac === UC_OTHER ? (c.facFree || "") : ""; out.dept = c.dept || ""; out.deptFree = (c.fac === UC_OTHER || c.dept === UC_OTHER) ? (c.deptFree || "") : ""; out.meths = (c.meths || []).filter((m) => m.m).map((m) => ({ m: m.m, date: m.date || "" })); }
      return out;
    });
  }
  async function ucSaveShibo() {
    const btns = document.querySelectorAll("[data-ucsave]");
    const cards = ucCleanCards(ucForm.cards);
    const missingDate = cards.some((c) => (c.meths || []).some((m) => { const r = ucFindMethod(c.u, m.m, c.fac); return r && r.ex.length > 1 && !m.date; }));
    if (missingDate) { showToast("受験日を選んでいない方式があります", "error"); return; }
    btns.forEach((b) => { b.disabled = true; b.textContent = "保存中..."; });
    try {
      const ct = { take: ucForm.ct.take || "", subj: ucForm.ct.take === "yes" ? (ucForm.ct.subj || []).slice(0, 20) : [] };
      const data = await ucPost({ action: "saveShibo", studentId, data: { ct, cards } });
      if (!data.ok) throw new Error(data.error);
      ucSaveCount++;
      ucShibo = data; ucShiboFresh = true; ucWriteCache(data);
      ucForm = { ct: JSON.parse(JSON.stringify(ct)), cards: cards.length ? JSON.parse(JSON.stringify(cards)) : [ucNewCard()] };
      ucRenderForm();
      showToast("志望校を保存しました");
    } catch (err) {
      btns.forEach((b) => { b.disabled = false; b.textContent = "保存する"; });
      showToast("保存に失敗しました。もう一度お試しください", "error");
    }
  }
</script>
</body>
