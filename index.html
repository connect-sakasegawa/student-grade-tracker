<script>

      var manifest = {

      var dataUri = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
      var link = document.createElement("link");
      link.rel = "manifest"; link.href = dataUri;

  })();
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700&family=Klee+One:wght@400;600&display=swap');
  :root {
    --ink: #1F2A44; --paper: #FFF6EC; --card: #FFFFFF; --line: #E8D9C6;
    --brand: #D9720B; --brand-soft: #FBE7D0;
    --growth: #3E7C59; --growth-soft: #E3EEE7;
    --amber: #B24D2F; --amber-soft: #F3DCD3;
    --muted: #7A6F63; --gold: #C99A2E; --gold-soft: #FBF0D0;
    --target-blue: #2A5FB4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding: max(20px, env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom)); min-height: 100vh; }

  .loading-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--paper); }
  .loading-title { font-family: 'Zilla Slab', serif; font-weight: 700; font-size: 36px; color: var(--brand); margin: 0 0 10px; }
  .loading-sub { font-size: 16px; color: var(--muted); line-height: 1.6; }

  .eyebrow { font-size: 13px; color: var(--muted); margin: 0 0 2px; }
  h1 { font-family: 'Zilla Slab', serif; font-weight: 600; font-size: 22px; margin: 0 0 4px; line-height: 1.25; color: var(--brand); }
  .student-name { font-size: 14px; color: var(--muted); margin: 0 0 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .force-refresh-btn { background: #FFFFFF; border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px; font-size: 11px; color: var(--muted); box-shadow: 0 1px 4px rgba(0,0,0,0.08); white-space: nowrap; flex-shrink: 0; }
  .force-refresh-btn:active { background: #F0F0F0; }
  .schedule-card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .schedule-card-header .section-title { margin: 0; }
  .header-rank-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: var(--brand); font-weight: 700; }
  .header-rank-badge svg { display: block; }
  .grades-guide-card { background: #FFF6C4; border: 1px solid var(--gold); }
  .grades-guide-title { font-size: 13px; font-weight: 700; color: #8A6A1E; margin: 0 0 8px; text-decoration: underline; }
  .grades-guide-item { font-size: 12.5px; color: var(--ink); line-height: 1.6; margin: 0 0 8px; }
  .grades-guide-item:last-child { margin-bottom: 0; }
  .grades-guide-item strong { display: block; color: #8A6A1E; margin-bottom: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .info-card { background: var(--paper); border: 1px dashed var(--line); }
  .info-card p { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; line-height: 1.5; }
  .info-card p:last-child { margin-bottom: 0; }
  .info-title { font-size: 12.5px; font-weight: 700; color: var(--ink); margin: 0 0 8px; }
  .naishin-note { font-size: 12px; color: var(--muted); margin: 4px 0 0; line-height: 1.5; }
  .naishin-tabs { display: flex; gap: 8px; margin: 12px 0; }
  .naishin-tab { flex: 1; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 13px; font-weight: 600; line-height: 1.35; font-family: inherit; }
  .naishin-tab span { font-size: 11px; font-weight: 500; }
  .naishin-tab.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .naishin-group { font-size: 12.5px; font-weight: 700; color: var(--brand); margin: 12px 0 2px; }
  .naishin-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .naishin-row select { width: 96px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); }
  .naishin-total { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0; padding: 12px 14px; border-radius: 10px; background: var(--brand-soft); font-size: 13px; font-weight: 600; }
  .naishin-total strong { font-size: 26px; color: var(--brand); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field select, .field input[type="text"] { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); }
  .field select:focus, .field input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  .field-note { font-size: 11.5px; color: var(--muted); margin: -8px 0 14px; line-height: 1.4; }

  .msg { font-size: 13px; border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; display: none; }
  .msg.error { color: #B3441E; background: #FCEBE3; }
  .msg.success { color: var(--growth); background: var(--growth-soft); }
  .msg.show { display: block; }

  button.submit { width: 100%; padding: 13px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; background: var(--brand); color: #fff; }
  button.submit:disabled { opacity: 0.6; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 22px 0 10px; }
  .list-note { font-size: 12px; color: var(--muted); margin: -6px 0 12px; display: flex; align-items: center; gap: 6px; }
  .list-note.schedule-red-note { color: #C0392B; font-weight: 600; }

  .subject-grid { margin-bottom: 4px; }
  .subject-grid-header, .subject-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 6px; align-items: center; }
  .subject-grid-header { font-size: 10.5px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .subject-grid-header span:nth-child(2), .subject-grid-header span:nth-child(3), .subject-grid-header span:nth-child(4) { text-align: center; }
  .subject-grid-header span.target-label { color: var(--target-blue); }
  .subject-row { padding: 6px 0; }
  .subject-row label { font-size: 13.5px; font-weight: 600; text-align: center; }
  .subject-row input { width: 100%; padding: 8px 4px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; text-align: center; background: #fff; color: var(--ink); }
  .target-cell { border-right: 1px dashed var(--muted); padding-right: 6px; }
  .target-cell input { color: var(--target-blue); font-weight: 600; }

  .hs-group-title { font-size: 12.5px; font-weight: 700; color: var(--brand); margin: 14px 0 4px; }
  .hs-group-title:first-child { margin-top: 0; }
  .hs-slot-label { display: flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; }
  .hs-slot-label .hs-slot-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hs-slot-edit-btn { flex-shrink: 0; background: none; border: none; padding: 2px; font-size: 12px; color: var(--muted); }

  .test-card { margin-bottom: 12px; }
  .test-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .test-name { font-family: 'Zilla Slab', serif; font-weight: 600; font-size: 16px; margin: 0; color: var(--ink); }

  .entry { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .entry:last-child { border-bottom: none; }
  .entry.total { font-weight: 700; }
  .entry-meta { color: var(--muted); font-size: 12px; display: block; }
  .score-badges { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 4px; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.done { background: var(--growth-soft); color: var(--growth); }
  .badge.pending { background: var(--amber-soft); color: var(--amber); }

  .photo-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; }
  .photo-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--brand); background: var(--brand-soft); color: var(--brand); font-size: 13px; font-weight: 600; }
  .photo-btn.done { border-color: var(--growth); background: var(--growth-soft); color: var(--growth); }
  input[type="file"] { display: none; }

  .coming-soon-card { text-align: center; padding: 32px 18px 28px; }
  .coming-soon-card .cs-icon { font-size: 44px; line-height: 1; margin-bottom: 12px; }
  .coming-soon-card .cs-title { font-size: 18px; font-weight: 700; color: var(--ink); margin: 0 0 10px; }
  .coming-soon-card .cs-text { font-size: 13.5px; color: var(--muted); line-height: 1.7; margin: 0; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 10px; }
  .id-error { text-align: center; padding: 60px 16px; color: var(--muted); font-size: 14px; }
  .install-hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; display: none; }
  .install-hint.show { display: block; }

  .badge-legend { display: flex; justify-content: space-around; margin-top: 10px; }
  .badge-legend-item { text-align: center; flex: 1; }
  .badge-legend-item .diff { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .test-date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
  .test-date-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .test-date-inline { margin: -4px 0 14px; padding: 10px 12px; background: var(--paper); border: 1px dashed var(--line); border-radius: 8px; }
  .test-date-inline .test-date-row { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .test-date-name { font-size: 11.5px; font-weight: 600; flex-shrink: 0; width: 100%; white-space: nowrap; margin-bottom: 4px; }
  .test-date-input-wrap { width: 100%; display: flex; align-items: center; gap: 6px; }
  .test-date-input-wrap input[type="date"] { flex: 1; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-family: inherit; background: #fff; color: var(--ink); }
  .test-date-input-wrap input[type="date"]:disabled { background: var(--paper); color: var(--muted); }
  .test-date-countdown { font-size: 11.5px; color: var(--brand); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
  .test-date-countdown.today { color: #C0392B; }
  .test-date-locked-flag { font-size: 10.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  .test-date-save-btn { padding: 7px 10px; border-radius: 8px; border: none; background: var(--brand); color: #fff; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .test-date-save-btn:disabled { opacity: 0.4; }
  .test-date-select-group { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .test-date-select-group select { flex: 1; min-width: 0; padding: 6px 2px; border: 1px solid var(--line); border-radius: 6px; font-size: 11.5px; font-family: inherit; background: #fff; color: var(--ink); }
  .test-date-fixed { font-size: 13px; font-weight: 600; color: var(--ink); }

  .mock-exam-slot { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); gap: 8px; }
  .mock-exam-slot:last-child { border-bottom: none; }
  .mock-exam-name { font-size: 13.5px; font-weight: 600; flex-shrink: 0; }
  .mock-exam-meta { flex: 1; text-align: right; }
  .mock-exam-links { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; margin-top: 2px; }
  .mock-exam-links a { font-size: 11px; color: var(--brand); text-decoration: underline; }
  .mock-exam-upload-btn { display: block; width: 100%; margin-top: 12px; padding: 12px; border-radius: 8px; border: 1px dashed var(--brand); background: var(--brand-soft); color: var(--brand); font-size: 13.5px; font-weight: 600; text-align: center; line-height: 1.5; box-sizing: border-box; }

  .week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .week-nav button { background: var(--brand-soft); color: var(--brand); border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
  .week-nav button:disabled { opacity: 0.5; }
  .week-nav .week-label { font-size: 13.5px; font-weight: 700; }

  .garden-stage-wrap { position: relative; border-radius: 10px; overflow: hidden; height: 160px; margin-bottom: 4px; }
  .garden-stage-bg { position: absolute; inset: 0; }
  .garden-stage-bg svg { display: block; width: 100%; height: 100%; }
  .garden-stage-fg { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 12px; }
  .garden-status { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 0 0; }
  .field-harvest { display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; border: none; background: var(--gold-soft); color: #8A6A1E; font-size: 16px; font-weight: 700; text-align: center; }
  .ready-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
  .ready-icon { width: 34px; height: 34px; }

  .preset-actions { margin: -6px 0 14px; }
  .preset-save-btn { width: 100%; padding: 9px; border-radius: 8px; border: 1px dashed var(--brand); background: var(--brand-soft); color: var(--brand); font-size: 12.5px; font-weight: 600; }
  .preset-list { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .preset-list-title { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
  .preset-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .preset-item:last-child { border-bottom: none; }
  .preset-item-text { flex: 1; margin-right: 8px; }
  .preset-item-cat { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; margin-right: 6px; }
  .preset-item-cat.homework { background: var(--brand-soft); color: var(--brand); }
  .preset-item-cat.self { background: var(--growth-soft); color: var(--growth); }
  .preset-delete-btn { background: none; border: none; color: var(--amber); font-size: 12px; padding: 4px 6px; }

  .day-block { margin-bottom: 14px; }
  .day-title { font-size: 13px; font-weight: 700; color: var(--brand); margin: 0 0 8px; }
  .mission-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .mission-item:last-child { border-bottom: none; }
  .mission-checkbox { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #fff; cursor: pointer; font-size: 14px; margin-top: 1px; }
  .mission-checkbox.checked { background: var(--growth); border-color: var(--growth); color: #fff; }
  .mission-text { font-size: 14px; flex: 1; }
  .mission-text.done { text-decoration: line-through; color: var(--muted); }
  .mission-cat { font-size: 11px; padding: 2px 7px; border-radius: 999px; margin-left: 6px; }
  .mission-cat.homework { background: var(--brand-soft); color: var(--brand); }
  .mission-cat.self { background: var(--growth-soft); color: var(--growth); }
  .mission-repeat-flag { font-size: 11px; margin-left: 4px; }
  .mission-delete-btn { background: none; border: none; padding: 2px 4px; font-size: 12px; color: var(--muted); flex-shrink: 0; margin-top: 1px; }
  .delete-opt-btn { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid #C0392B; background: #fff; color: #C0392B; font-size: 14px; font-weight: 700; margin-top: 10px; font-family: inherit; }
  .delete-opt-btn.solid { background: #C0392B; color: #fff; }
  .delete-cancel-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--paper); color: var(--muted); font-size: 14px; font-weight: 600; margin-top: 10px; font-family: inherit; }
  .delete-target { font-size: 13.5px; font-weight: 600; background: var(--paper); border-radius: 8px; padding: 10px 12px; margin: 0 0 4px; word-break: break-all; }
  .delete-hint { font-size: 11.5px; color: var(--muted); margin: 4px 0 0; line-height: 1.5; }
  .mission-edit-btn { background: none; border: none; padding: 2px 4px; font-size: 12px; color: var(--muted); flex-shrink: 0; margin-top: 1px; }
  .day-empty { font-size: 12.5px; color: var(--muted); padding: 4px 0; }

  .fruit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fruit-cell { text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; font-size: 22px; }
  .fruit-cell svg { width: 26px; height: 26px; }
  .fruit-cell.rare svg { width: 38px; height: 38px; }
  .fruit-cell .count { display: block; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  .fruit-cell .fruit-name { display: block; font-size: 8.5px; color: #8A6A1E; font-weight: 700; margin-top: 4px; line-height: 1.3; }
  .fruit-cell.rare { background: #FFFFFF; border-color: var(--gold); }
  .fruit-cell.mystery { opacity: 0.5; }
  .history-fruit-icon { vertical-align: middle; margin-right: 4px; width:20px;height:20px; }

  .rank-current { text-align: center; padding: 18px; border-radius: 12px; margin-bottom: 16px; }
  .rank-current .rank-medal { margin-bottom: 6px; }
  .rank-current .rank-name { font-family: 'Zilla Slab', serif; font-size: 24px; font-weight: 700; margin: 0 0 4px; }
  .rank-current .rank-next { font-size: 12px; }
  .rank-class-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
  .rank-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
  .rank-row.current { font-weight: 700; color: var(--brand); }
  .rank-row .pt { color: var(--muted); font-size: 12px; }

  .schedule-month-select { margin-bottom: 14px; }
  .schedule-updated-note { font-size: 12px; color: var(--muted); text-align: right; margin: 0 0 14px; }
  .schedule-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .schedule-table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .schedule-col-date { width: 66px; }
  .schedule-table th, .schedule-table td { border: 1px solid var(--line); padding: 4px 2px; text-align: center; font-size: 10px; overflow: hidden; }
  .schedule-table th { background: var(--paper); color: var(--muted); font-weight: 700; }
  .schedule-table th.schedule-time-row { font-weight: 500; font-size: 8.5px; color: var(--muted); }
  .schedule-table td.schedule-daycell { background: var(--paper); font-weight: 700; color: var(--ink); text-align: left; padding-left: 4px; font-size: 10px; white-space: normal; line-height: 1.3; }
  .schedule-table tr.schedule-today td { background: #FBE7D0; }
  .schedule-table td.schedule-cell-changed { background: #FFF6C4; font-weight: 700; color: #8A6A1E; }
  .schedule-legend { font-size: 11px; color: var(--muted); margin: 10px 0 0; display: flex; align-items: center; gap: 6px; }
  .schedule-legend-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: #FFF6C4; border: 1px solid var(--line); }
  .schedule-notes-list { margin: 0; padding-left: 18px; }
  .schedule-notes-list li { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 4px; }

  .od-nav .od-btn:last-child { background: var(--brand); border-color: var(--brand); color: #fff; }

  .od-toc-list { display: grid; gap: 8px; }
  .od-toc-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-align: left; font-family: inherit; color: var(--ink); cursor: pointer; }
  .od-toc-item.on { border-color: var(--brand); background: var(--brand-soft); }
  .od-toc-item .od-ut { flex: 1; min-width: 0; }
  .od-toc-item b { display: block; font-family: var(--od-en); font-size: 14px; }
  .od-toc-item small { display: block; font-size: 11.5px; color: var(--muted); }
  .od-toc-item .od-cnt { flex: none; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .od-toc-item .od-cnt.all { color: var(--od-ok); }

  function formatDateTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  function formatDate(iso) { if (!iso) return ""; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; }
  function addDaysToYMD(ymd, days) {
    const d = new Date(ymd + "T00:00:00"); d.setDate(d.getDate() + days);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function formatMD(ymd) { const d = new Date(ymd + "T00:00:00"); return `${d.getMonth() + 1}/${d.getDate()}`; }
  function todayYMD() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

  function calcTotal(subjects, list) {
    const relevant = subjects.filter((s) => list.indexOf(s.subject) !== -1 && s.score !== null);
    if (relevant.length === 0) return null;
    return relevant.reduce((sum, s) => sum + Number(s.score), 0);
  }

  function currentTestNames() { return (currentData && currentData.isHighSchool) ? HS_TEST_NAMES : TEST_NAMES; }

  function getPreviousScore(subject, testName) {
    const testNames = currentTestNames();
    const idx = testNames.indexOf(testName);
    if (idx <= 0 || !currentData) return null;
    const catStart = idx >= EXAM_CATEGORY_BREAK_INDEX ? EXAM_CATEGORY_BREAK_INDEX : 0;
    if (idx === catStart) return null;
    const testsByName = {};
    (currentData.tests || []).forEach((t) => { testsByName[t.testName] = t; });
    for (let i = idx - 1; i >= catStart; i--) {
      const t = testsByName[testNames[i]];
      if (!t) continue;
      const s = t.subjects.find((s) => s.subject === subject);
      if (s && s.score !== null) return s.score;
    }
    return null;
  }

  // 前回読み込んだデータをこの端末に保存しておき、次に開いたときはまずそれを表示する（その裏で最新を読み込んで差し替える）
  function appCacheGet(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (err) { return null; } }
  function appCacheSet(key, d) { try { localStorage.setItem(key, JSON.stringify(d)); } catch (err) {} }
  function appCacheClear(key) { try { localStorage.removeItem(key); } catch (err) {} }
  function showSyncBadge(on) {
    let b = document.getElementById("app-sync-badge");
    if (!on) { if (b) b.remove(); return; }
    if (b) return;
    b = document.createElement("div");

    b.style.cssText = "position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:50%;transform:translateX(-50%);z-index:9999;background:rgba(31,42,68,0.85);color:#fff;font-size:12px;padding:5px 12px;border-radius:999px;pointer-events:none;";
    document.body.appendChild(b);
  }
  const APP_CACHE_KEY = "connect-app-cache-v1_" + studentId;

  async function loadAndRender() {
    let fromCache = false;
    if (!currentData) {
      const cached = appCacheGet(APP_CACHE_KEY);
      if (cached && cached.ok) {
        currentData = cached;
        if (cached.isElementary && currentTab === "grades") currentTab = NOTEBOOK_ENABLED ? "notebook" : "schedule";
        try { renderShell(); fromCache = true; } catch (err) { currentData = null; }
        if (fromCache) showSyncBadge(true);
      }
      if (!fromCache) appEl.innerHTML = `<div class="loading-screen">${LOADING_TEXT}</div>`;
    }
    let data;
    try { data = await fetchData(); }
    catch (err) {
      showSyncBadge(false);
      if (fromCache) return;
      appEl.innerHTML = `<div class="id-error">通信に失敗しました。電波の良い場所でもう一度お試しください。</div>`; return;
    }
    showSyncBadge(false);
    if (!data.ok) { appCacheClear(APP_CACHE_KEY); appEl.innerHTML = `<div class="id-error">リンクが無効です。講師に確認してください。</div>`; return; }
    if (urlId) localStorage.setItem(STORAGE_KEY_ID, urlId);
    appCacheSet(APP_CACHE_KEY, data);

    checkRankChange(data.rank);
    currentData = data;
    if (fromCache) { selectedWeekStart = null; invalidateWeekCache(); }
    if (!selectedWeekStart) selectedWeekStart = data.weekStart;
    if (data.isElementary && currentTab === "grades") currentTab = NOTEBOOK_ENABLED ? "notebook" : "schedule";
    renderShell();
    ucPrefetchShibo();
  }

  function checkRankChange(newRank) {
    if (!newRank) return;
    const changed = lastSeenRank !== null && newRank.rankName !== lastSeenRank;
    lastSeenRank = newRank.rankName;
    if (changed) {
      const info = { rankName: newRank.rankName, className: newRank.className };
      const celebrationOpen = document.getElementById("celebration-container").classList.contains("show");
      if (celebrationOpen) pendingRankUp = info; else showRankUpCelebration(info.rankName, info.className);
    }
  }

  // ---------- 音読トレーニング（スラッシュ音読ノート・中学生だけ） ----------
  // 本文は教科書の著作物なので、このファイルには入れない。GASの ?ondoku=1&id= から、その生徒の学年の分だけ受け取る。
  // 「言えた」と開いていた場所は、この端末の中（localStorage）にだけ保存する。
  const OD_DATA_KEY = "connect-ondoku-data-v1-";
  const OD_DONE_KEY = "connect-ondoku-done-v1-";
  const OD_POS_KEY = "connect-ondoku-pos-v1-";
  const od = { data: null, loading: false, error: "", unit: 0, part: 0, mode: "both", sv: "on", sl: "on", done: {}, sheet: null };
  function odIsJuniorHigh() { return !!currentData && !currentData.isHighSchool && !currentData.isElementary; }
  function odGetLS(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (err) { return null; } }
  function odSetLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (err) {} }
  function odEntryHtml() {
    if (!odIsJuniorHigh()) return "";
    return `<button type="button" class="uc-entry-btn" id="od-open"><span>📖 音読トレーニング<small>教科書の英文を、和訳を見て言えるように練習します</small></span><span class="uc-arrow">›</span></button>`;
  }
  function odBindEntry() {
    const b = document.getElementById("od-open");
    if (b) b.addEventListener("click", odOpen);
  }
  // {S|...} を主語、{V|...} を述語の印にする（中身は文字としてそのまま表示）
  function odMark(s) { return escapeHtml(s).replace(/\{([SV])\|([^}]*)\}/g, '<span class="od-r od-r$1">$2</span>'); }
  function odUnits() { return (od.data && od.data.units) || []; }
  function odKey(ui, pi, si) { const u = odUnits()[ui]; return od.data.grade + "-" + (u ? u.id : ui) + "-" + pi + "-" + si; }
  function odDoneCount(ui, pi) {
    const p = odUnits()[ui].parts[pi];
    return p.s.reduce((n, _, si) => n + (od.done[odKey(ui, pi, si)] ? 1 : 0), 0);
  }
  function odUnitCount(ui) {
    const u = odUnits()[ui]; let d = 0, n = 0;
    u.parts.forEach((p, pi) => { n += p.s.length; d += odDoneCount(ui, pi); });
    return { d, n };
  }
  function odSavePos() { const u = odUnits()[od.unit]; if (u) odSetLS(OD_POS_KEY + studentId, { unit: u.id, part: od.part }); }
  function odRestorePos() {
    const pos = odGetLS(OD_POS_KEY + studentId), us = odUnits();
    od.unit = 0; od.part = 0;
    if (pos) {
      const i = us.findIndex((u) => u.id === pos.unit);
      if (i !== -1) { od.unit = i; od.part = Math.min(Number(pos.part) || 0, us[i].parts.length - 1); }
    }
  }

  async function odOpen() {
    ucCloseOverlay(); odClose();

    od.done = odGetLS(OD_DONE_KEY + studentId) || {};
    if (!od.data) od.data = odGetLS(OD_DATA_KEY + studentId);
    if (od.data) { odRestorePos(); odRender(); } else { odRenderLoading(); }
    // 最新の本文を取りに行く（前回の内容があれば先に表示しておき、変わっていたら描き直す）
    try {
      const res = await fetch(`${GAS_URL}?ondoku=1&id=${encodeURIComponent(studentId)}`);
      const d = await res.json();
      if (!document.getElementById("od-overlay")) return;
      if (!d.ok) { if (!od.data) { od.error = d.error || "読み込めませんでした"; odRenderLoading(); } return; }
      const changed = JSON.stringify(d) !== JSON.stringify(od.data);
      od.data = d; odSetLS(OD_DATA_KEY + studentId, d);
      if (changed) { odRestorePos(); odRender(); }
    } catch (err) {
      if (!od.data && document.getElementById("od-overlay")) { od.error = "通信できませんでした。電波のよいところで、もう一度開いてください。"; odRenderLoading(); }

    p.s.forEach((s, si) => {

    ov.innerHTML = h;

  function odChunkHtml(c, i) {

  function odBindOverlay(ov) {

      const act = a.dataset.od;
      if (act === "close") { odClose(); return; }
      if (act === "retry") { od.error = ""; odClose(); odOpen(); return; }
      if (act === "sv" || act === "sl") { od[act] = od[act] === "on" ? "off" : "on"; odRenderKeepScroll(); return; }
      if (act === "toc") { odOpenToc(); return; }
      const card = a.closest(".od-card"); if (!card) return;
      const si = Number(card.dataset.si);
      if (act === "reveal") {
        const cells = card.querySelectorAll(".od-ch");

  // ---------- コネーシャタブ(今は準備中の画面) ----------
  // ---- コネーシャの返事の表示(数式・図) ----
  const KONESHA_SVG_OK_TAGS = new Set(["svg", "g", "path", "line", "polyline", "polygon", "rect", "circle", "ellipse", "text", "tspan", "defs", "marker", "title", "desc"]);
  function koneshaCleanSvgAttrs(node) {
    Array.from(node.attributes).forEach((a) => {
      const n = a.name.toLowerCase(), v = String(a.value);
      if (n.indexOf("on") === 0 || n.indexOf("href") !== -1 || /javascript:|data:text|expression\(|@import/i.test(v) || (n === "style" && /url\(/i.test(v))) node.removeAttribute(a.name);
    });
  }
  // AIが描いた図を、安全な部品だけに絞る(スクリプトや外部読み込みは取り除く)
  function koneshaSanitizeSvg(src) {
    try {
      const doc = new DOMParser().parseFromString(src, "image/svg+xml");
      const root = doc.documentElement;
      if (!root || root.localName.toLowerCase() !== "svg" || doc.getElementsByTagName("parsererror").length) return "";
      if (!root.getAttribute("viewBox")) return "";
      const walk = (node) => {
        Array.from(node.children).forEach((ch) => {
          if (!KONESHA_SVG_OK_TAGS.has(ch.localName.toLowerCase())) { ch.remove(); return; }
          koneshaCleanSvgAttrs(ch); walk(ch);
        });
      };
      koneshaCleanSvgAttrs(root); walk(root);
      root.removeAttribute("width"); root.removeAttribute("height");
      root.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      return new XMLSerializer().serializeToString(root);
    } catch (e) { return ""; }
  }
  // 板書の色の目印: [赤]重要[/赤] [青]見出し・まとめ[/青] [波]赤い波線[/波] [枠]ポイントの枠[/枠]
  const KONESHA_INK_TAGS = { "赤": "wb-red", "青": "wb-blue", "波": "wb-wave" };
  // 文章のなかの数式($...$ / $$...$$)と色の目印を、板書の表示にする
  function koneshaInkHtml(raw) {
    raw = raw.replace(/^\n+|\n+$/g, "").replace(/\n?\[枠\]\n?/g, "[枠]").replace(/\n?\[\/枠\]\n?/g, "[/枠]").replace(/\n?(\$\$[\s\S]+?\$\$)\n?/g, "$1");
    if (!raw) return "";
    const math = [];
    let s = raw.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, (p) => { math.push(p); return "\u0000" + (math.length - 1) + "\u0000"; });
    s = escapeHtml(s);
    for (let i = 0; i < 3; i++) {
      s = s.replace(/\[(赤|青|波|枠)\]([\s\S]*?)\[\/\1\]/g, (m, t, inner) => t === "枠"
        ? `<span class="wb-box"><span class="wb-box-label">point</span>${inner}</span>`
        : `<span class="${KONESHA_INK_TAGS[t]}">${inner}</span>`);
    }
    s = s.replace(/\[\/?(赤|青|波|枠)\]/g, "").replace(/\n/g, "<br />"); // 閉じ忘れた目印は消す
    return s.replace(/\u0000(\d+)\u0000/g, (m, i) => {
      const p = math[Number(i)];
      const display = p.indexOf("$$") === 0;
      const tex = display ? p.slice(2, -2) : p.slice(1, -1);
      if (window.katex) { try { return window.katex.renderToString(tex, { displayMode: display, throwOnError: false }); } catch (e) {} }
      return escapeHtml(tex);
    });
  }
  function koneshaRichHtml(text) {
    let out = "", last = 0, m;
    const re = /\[\[図\]\]([\s\S]*?)\[\[\/図\]\]/g;
    while ((m = re.exec(text))) {
      out += koneshaInkHtml(text.slice(last, m.index));
      const svg = koneshaSanitizeSvg(m[1].trim());
      if (svg) out += `<div class="konesha-figure"><img alt="コネーシャの図" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}" /><span>イメージ図</span></div>`;
      last = re.lastIndex;
    }
    let rest = text.slice(last);
    const open = rest.indexOf("[[図]]");
    if (open !== -1) rest = rest.slice(0, open); // 途中で切れた図は表示しない
    return out + koneshaInkHtml(rest);
  }

  // ---- コネーシャ質問チャット ----
  const KONESHA_DESC_LINES = ["コネクトに住みつく学問の神様", "趣味は寺社仏閣巡り", "カメムシが苦手"];
  const KONESHA_NO_TEXT_LABEL = "(画像を送りました)";
  const koneshaState = { info: null, infoError: "", loadingInfo: false, category: null, mode: "hint", hintLevel: "light", sessions: { hint: [], explain: [], study: [] }, cur: { hint: null, explain: null, study: null }, view: "board", page: null, full: false, fresh: false, loaded: false, busy: false, draft: "", error: "", image: null, imageBusy: false, el: null };

  async function koneshaPost(payload) {

  async function koneshaLoadInfo() {

  // ---- 質問の保存(この端末のブラウザに、一定期間・一定件数だけ残す) ----
  // 1つの質問 = 最初の質問と、その板書について続けて聞いたやり取りのまとまり
  const KONESHA_KEEP_DAYS = 7;      // この日数をすぎた質問は自動で消える
  const KONESHA_KEEP_SESSIONS = 20; // 各欄(ヒント・解説・勉強法)で残す最大の質問数
  const KONESHA_MAX_TURNS = 5;      // 1つの板書について続けて聞ける回数
  const KONESHA_KEYS = ["hint", "explain", "study"];
  const KONESHA_KEY_LABEL = { hint: "ヒント", explain: "解説", study: "勉強法・教材" };
  function koneshaStoreKey() { return "connect_konesha_chats_" + studentId; }
  function koneshaPruneSessions(list) {
    const limit = Date.now() - KONESHA_KEEP_DAYS * 86400000;
    return (list || []).filter((s) => s && s.id && s.t && s.t >= limit && Array.isArray(s.turns) && s.turns.length)
      .map((s) => Object.assign(s, { turns: s.turns.filter((u) => u && typeof u.q === "string" && typeof u.a === "string") }))
      .filter((s) => s.turns.length)
      .slice(-KONESHA_KEEP_SESSIONS);
  }
  // 前の版(チャット形式)で保存した会話は、質問と返事の1組ずつを1つの質問として引きつぐ
  function koneshaFromOldChat(list) {
    const out = [];
    (list || []).forEach((m) => {
      if (!m || typeof m.content !== "string") return;
      if (m.role === "user") out.push({ id: "o" + m.t + "_" + out.length, t: m.t, turns: [{ q: m.content, hadImage: !!m.hadImage, a: null, t: m.t }] });
      else if (m.role === "assistant" && out.length && out[out.length - 1].turns[0].a === null) { out[out.length - 1].turns[0].a = m.content; out[out.length - 1].t = m.t; }
    });
    return out.filter((s) => s.turns[0].a !== null);
  }
  function koneshaLoadChats() {
    koneshaState.loaded = true;
    try {
      const raw = localStorage.getItem(koneshaStoreKey());
      if (!raw) return;
      const d = JSON.parse(raw);
      KONESHA_KEYS.forEach((k) => {
        koneshaState.sessions[k] = koneshaPruneSessions(d && d.v === 2 ? d.sessions && d.sessions[k] : koneshaFromOldChat(d && d.chats && d.chats[k]));
      });
    } catch (e) {}
  }
  function koneshaSaveChats() {
    try {
      const out = {};
      KONESHA_KEYS.forEach((k) => {
        koneshaState.sessions[k] = koneshaPruneSessions(koneshaState.sessions[k]);
        out[k] = koneshaState.sessions[k].map((s) => ({ id: s.id, t: s.t, level: s.level, turns: s.turns.map((u) => ({ q: u.q, a: u.a, t: u.t, hadImage: !!(u.thumb || u.hadImage) })) }));
      });
      localStorage.setItem(koneshaStoreKey(), JSON.stringify({ v: 2, sessions: out }));
    } catch (e) {}
  }

  // いまの欄(ヒントと解説は別々に記録する)
  function koneshaKey() { return koneshaState.category === "subject" ? koneshaState.mode : "study"; }
  function koneshaCurSession() {
    const k = koneshaKey(), id = koneshaState.cur[k];
    return id ? koneshaState.sessions[k].find((s) => s.id === id) || null : null;
  }

  function koneshaRerender() {
    const el = koneshaState.el;
    if (currentTab === "konesha" && el && document.body.contains(el)) renderKonesha(el);

  function koneshaStart(category) {

  }
  function koneshaBack() {

    koneshaRerender();

  // 板書を消して、新しい質問を書けるようにする
  function koneshaNewBoard() {
    if (koneshaState.busy) return;

  function koneshaOpenSession(key, id) {
    const st = koneshaState;
    st.category = key === "study" ? "study" : "subject";
    if (key !== "study") st.mode = key;

  // 選んだ写真を縮小して JPEG にする(通信量とAPI費用をおさえるため、長辺1600pxまで)
  function koneshaPrepareImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const MAX = 1600;
          const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          let q = 0.85, dataUrl = canvas.toDataURL("image/jpeg", q);
          while (dataUrl.length > 2400000 && q > 0.4) { q -= 0.15; dataUrl = canvas.toDataURL("image/jpeg", q); }
          URL.revokeObjectURL(url);
          resolve({ dataUrl, base64: dataUrl.split(",")[1], mediaType: "image/jpeg" });
        } catch (e) { URL.revokeObjectURL(url); reject(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
      img.src = url;
    });
  }

  async function koneshaPickImage(file) {
    if (!file || koneshaState.busy) return;
    koneshaState.imageBusy = true; koneshaState.error = ""; koneshaRerender();
    try { koneshaState.image = await koneshaPrepareImage(file); }
    catch (e) { koneshaState.image = null; koneshaState.error = "この写真は読み込めへんかったわ。別の写真で試してな。"; }
    koneshaState.imageBusy = false;
    koneshaRerender();
  }

  async function koneshaSend() {
    const st = koneshaState;
    if (st.busy || st.imageBusy) return;
    const text = (st.draft || "").trim();
    const image = st.image;
    if (!text && !image) return;
    if (st.info && st.info.remaining <= 0) { st.error = "今月の質問回数の上限に達したみたいや。来月になったらまた質問できるで。急ぎのときは、教室のLINEで先生に聞いてみてな。"; koneshaRerender(); return; }
    const key = koneshaKey(), list = st.sessions[key];
    let session = koneshaCurSession();
    const isNew = !session || session.turns.length >= KONESHA_MAX_TURNS;
    if (isNew) {
      session = { id: "s" + Date.now(), t: Date.now(), level: st.category === "subject" && st.mode === "hint" ? st.hintLevel : "", turns: [] };
      list.push(session); st.cur[key] = session.id;
    }
    const turn = { q: text || KONESHA_NO_TEXT_LABEL, thumb: image ? image.dataUrl : null, a: null, t: Date.now() };
    session.turns.push(turn);
    st.draft = ""; st.image = null; st.error = ""; st.busy = true; st.page = null; st.fresh = false;
    koneshaRerender(); koneshaScrollTo("konesha-top");
    const undo = () => {
      session.turns.pop();
      if (isNew) { list.splice(list.indexOf(session), 1); st.cur[key] = null; }
      st.draft = text; st.image = image; // 送れなかった質問は入力欄にもどす
    };
    try {
      // 続けて聞くときは、この板書のやり取りだけを送る(関係のない昔の会話は送らない)
      const messages = [];
      session.turns.forEach((u) => { messages.push({ role: "user", content: u.q }); if (u.a) messages.push({ role: "assistant", content: u.a }); });
      const payload = { action: "askKonesha", studentId, category: st.category, mode: st.mode, hintLevel: st.hintLevel, messages };
      if (image) payload.image = { mediaType: image.mediaType, data: image.base64 };
      const r = await koneshaPost(payload);
      if (r && r.ok) {
        turn.a = r.reply; turn.t = Date.now(); session.t = turn.t; st.fresh = true;
      } else {
        undo(); st.error = (r && r.error) || "うまく答えられへんかったわ。もう一回聞いてな。";
      }
      if (r && typeof r.remaining === "number" && st.info) { st.info.remaining = r.remaining; st.info.used = r.used; st.info.limit = r.limit; }
    } catch (e) {
      undo(); st.error = "通信できへんかったわ。電波のええとこで、もう一回試してな。(回数は減ってへんで)";
    }
    st.busy = false;
    koneshaSaveChats();
    koneshaRerender(); koneshaScrollTo("konesha-top");
  }

  function koneshaScrollTo(id) {
    setTimeout(() => { const t = document.getElementById(id); if (t && t.scrollIntoView) t.scrollIntoView({ block: "start", behavior: "smooth" }); }, 60);
  }
  function koneshaDateLabel(t) {
    const d = new Date(t);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }

  // 過去の質問内容(すべての欄をまとめて、新しい順)
  function renderKoneshaHistory(el) {
    const st = koneshaState;
    const all = [];

    const rows = all.map(({ k, s }) => {
      const first = s.turns[0];
      const photo = first.thumb || first.hadImage;
      const q = first.q === KONESHA_NO_TEXT_LABEL && photo ? "(写真で質問)" : first.q;
      const lv = k === "hint" ? (s.level === "strong" ? "がっつり" : "ちょっとだけ") : "";
      return `<button class="kh-item kh-${k}" data-k="${k}" data-id="${escapeHtml(s.id)}">
          <div class="kh-meta"><span class="kh-tag">${KONESHA_KEY_LABEL[k]}${lv ? "・" + lv : ""}</span><span>${koneshaDateLabel(s.t)}</span>${photo ? "<span>📷</span>" : ""}${s.turns.length > 1 ? `<span>続けて${s.turns.length - 1}回</span>` : ""}</div>

  // ホーム画面に追加した状態(ブラウザの更新ボタンがない状態)でも、
  // キャッシュを消してから読み込み直すことで、最新版になっているか確認できるようにする
  async function forceRefreshApp() {
    const btn = document.getElementById("force-refresh-btn");
    if (btn) btn.textContent = "更新中…";
    appCacheClear(APP_CACHE_KEY);
    try {
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
    } catch (err) {}
    location.reload();
  }

  function naishinFmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }
  function naishinCalc(ratings) {
    let total = 0, count = 0;
    NAISHIN_MAIN.forEach((s) => { const r = Number(ratings[s]); if (r >= 1 && r <= 5) { total += r * 4; count++; } });
    NAISHIN_SUB.forEach((s) => { const r = Number(ratings[s]); if (r >= 1 && r <= 5) { total += r * 7.5; count++; } });
    return { total, complete: count === NAISHIN_MAIN.length + NAISHIN_SUB.length };
  }
  function drawNaishin() {
    const el = document.getElementById("naishin-section");
    if (!el) return;
    const nd = (currentData && currentData.naishin) || { terms: [] };
    const saved = nd.terms.find((t) => t.term === naishinTerm) || { ratings: {} };
    const tabs = NAISHIN_TERMS.map((term) => {
      const t = nd.terms.find((x) => x.term === term);
      const sub = t && t.total !== null && t.total !== undefined ? `${naishinFmt(t.total)}点` : "未入力";
      return `<button type="button" class="naishin-tab ${term === naishinTerm ? "active" : ""}" data-term="${term}">${term}<br><span>${sub}</span></button>`;
    }).join("");
    const row = (s) => `
      <div class="naishin-row"><label for="ns-${s}">${s}</label>
        <select id="ns-${s}" data-ns="${s}"><option value="">—</option>${[5, 4, 3, 2, 1].map((n) => `<option value="${n}" ${saved.ratings && saved.ratings[s] === n ? "selected" : ""}>${n}</option>`).join("")}</select>
      </div>`;
    el.innerHTML = `
      <div class="card">
        <p class="info-title">内申点(通知表)</p>
        <p class="naishin-note">通知表の5段階評価を入れると、内申点が自動で計算されます。主要5教科は×4、副教科は×7.5で、オール5なら250点満点です。</p>
        <div class="naishin-tabs">${tabs}</div>
        <p class="naishin-group">主要5教科(×4)</p>
        ${NAISHIN_MAIN.map(row).join("")}
        <p class="naishin-group">副教科(×7.5)</p>
        ${NAISHIN_SUB.map(row).join("")}
        <div class="naishin-total"><span>${naishinTerm}の内申点<br><span id="naishin-incomplete" style="font-size:11px;font-weight:500;color:var(--muted)"></span></span><span><strong id="naishin-total-value">-</strong> / 250</span></div>
        <div id="naishin-error" class="msg error"></div>
        <button class="submit" id="naishin-save-btn" type="button">${naishinTerm}の内申点を保存する</button>
      </div>`;
    const readRatings = () => {
      const r = {};
      el.querySelectorAll("select[data-ns]").forEach((sel) => { r[sel.dataset.ns] = sel.value === "" ? null : Number(sel.value); });
      return r;
    };
    const updateTotal = () => {
      const c = naishinCalc(readRatings());
      const any = Object.values(readRatings()).some((v) => v !== null);
      document.getElementById("naishin-total-value").textContent = any ? naishinFmt(c.total) : "-";
      document.getElementById("naishin-incomplete").textContent = any && !c.complete ? "未入力の教科があります" : "";
    };
    el.querySelectorAll("select[data-ns]").forEach((sel) => sel.addEventListener("change", updateTotal));
    el.querySelectorAll(".naishin-tab").forEach((btn) => btn.addEventListener("click", () => { naishinTerm = btn.dataset.term; drawNaishin(); }));
    document.getElementById("naishin-save-btn").addEventListener("click", async () => {
      const btn = document.getElementById("naishin-save-btn");
      const errorEl = document.getElementById("naishin-error");
      errorEl.classList.remove("show");
      const ratings = readRatings();
      if (!Object.values(ratings).some((v) => v !== null)) return showFieldError(errorEl, "評価を1つ以上入力してください");
      btn.disabled = true; btn.textContent = "保存中...";
      try {
        const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "saveNaishin", studentId, term: naishinTerm, ratings }) });
        const result = await res.json();
        if (!result.ok) throw new Error(result.error || "failed");
        if (!currentData.naishin) currentData.naishin = { terms: NAISHIN_TERMS.map((t) => ({ term: t, ratings: {}, total: null, complete: false })), max: 250 };
        const c = naishinCalc(ratings);
        const idx = currentData.naishin.terms.findIndex((t) => t.term === naishinTerm);
        const entry = { term: naishinTerm, ratings, total: c.total, complete: c.complete };
        if (idx === -1) currentData.naishin.terms.push(entry); else currentData.naishin.terms[idx] = entry;

  }

  async function handleSetTestDate(testName, testDate) {
    if (!testDate) return;
    const testDates = currentData.testDates || [];
    const existing = testDates.find((t) => t.testName === testName);
    if (existing && existing.testDate === testDate) return;
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "setTestDate", studentId, testName, testDate }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      currentData.testDates = currentData.testDates || [];
      const idx = currentData.testDates.findIndex((t) => t.testName === testName);
      const today = todayYMD();
      const locked = today >= testDate;
      const d = new Date(testDate + "T00:00:00");
      const t = new Date(today + "T00:00:00");
      const daysUntil = Math.round((d - t) / 86400000);
      const entry = { testName, testDate, locked, daysUntil };
      if (idx === -1) currentData.testDates.push(entry); else currentData.testDates[idx] = entry;

  function showFieldError(el, msg) { el.textContent = msg; el.classList.add("show"); }

  function mergeTestScoresLocally(testName, submittedSubjects) {
    currentData.tests = currentData.tests || [];
    const isHS = !!currentData.isHighSchool;
    const isES = !!currentData.isElementary;
    const subjectKeys = isHS ? HS_SLOT_KEYS : (isES ? ES_SUBJECTS : SUBJECTS);
    let test = currentData.tests.find((t) => t.testName === testName);
    if (!test) {
      test = { testName, subjects: subjectKeys.map((s) => ({ subject: s, score: null, average: null, target: null })) };
      currentData.tests.push(test);
    }
    submittedSubjects.forEach((sub) => {
      const entry = test.subjects.find((s) => s.subject === sub.subject);
      if (!entry) return;
      if (sub.score !== null) entry.score = sub.score;
      if (sub.average !== null) entry.average = sub.average;
      if (sub.target !== null) entry.target = sub.target;
    });
  }

  async function handleAddScore(e) {
    e.preventDefault();
    const testNameEl = document.getElementById("testName");
    const errorEl = document.getElementById("form-error");
    const successEl = document.getElementById("form-success");
    const btn = document.getElementById("submit-btn");
    errorEl.classList.remove("show"); successEl.classList.remove("show");
    const testName = testNameEl.value;
    if (!testName) return showFieldError(errorEl, "テスト名を選択してください");

    const isHS = !!(currentData && currentData.isHighSchool);
    const isES = !!(currentData && currentData.isElementary);
    const subjectKeys = isHS ? HS_SLOT_KEYS : (isES ? ES_SUBJECTS : SUBJECTS);

    const subjects = []; let validationError = "";
    subjectKeys.forEach((subjectKey) => {
      if (validationError) return;
      const scoreInput = document.querySelector(`input[data-subject="${subjectKey}"][data-field="score"]`);
      const avgInput = document.querySelector(`input[data-subject="${subjectKey}"][data-field="average"]`);
      const targetInput = document.querySelector(`input[data-subject="${subjectKey}"][data-field="target"]`);
      const scoreRaw = scoreInput.value, avgRaw = avgInput.value, targetRaw = targetInput.value;
      if (scoreRaw === "" && avgRaw === "" && targetRaw === "") return;
      const parseOrError = (raw, label) => {
        if (raw === "") return null;
        const n = Number(raw);
        if (Number.isNaN(n) || n < 0 || n > 100) { validationError = `${label}は0〜100の数字で入力してください`; return null; }
        return n;
      };
      const target = parseOrError(targetRaw, "目標点"); if (validationError) return;
      const score = parseOrError(scoreRaw, "点数"); if (validationError) return;
      const average = parseOrError(avgRaw, "平均点"); if (validationError) return;
      if (target !== null) {
        const prev = getPreviousScore(subjectKey, testName);
        if (prev !== null && target < prev) { validationError = `目標点は、前回の点数(${prev}点)以上にしよう`; return; }
      }
      subjects.push({ subject: subjectKey, score, average, target });
    });
    if (validationError) return showFieldError(errorEl, validationError);
    if (subjects.length === 0) return showFieldError(errorEl, "少なくとも1科目は入力してください");

    btn.disabled = true; btn.textContent = "保存中...";
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "addTestScores", studentId, testName, subjects }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      mergeTestScoresLocally(testName, subjects);
      successEl.classList.add("show");
      renderGrades(document.getElementById("tab-content"));
      showToast("記録しました");
      syncRankOnly();
    } catch (err) {
      showFieldError(errorEl, err.message || "保存に失敗しました。もう一度お試しください。");
    } finally { btn.disabled = false; btn.textContent = "この結果を記録する"; }
  }

  function compressImage(file, maxWidth = 1600, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale; canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
        };
        img.onerror = reject; img.src = reader.result;
      };
      reader.onerror = reject; reader.readAsDataURL(file);
    });
  }

  async function changeWeek(days) {
    if (weekNavBusy) return;
    const newWeekStart = addDaysToYMD(selectedWeekStart || currentData.weekStart, days);
    weekCache[selectedWeekStart || currentData.weekStart] = currentData.missions;
    const cached = weekCache[newWeekStart];
    if (cached) {
      // すでに読み込み済みの週は、待たずにすぐ表示し、裏で最新の状態に更新する
      selectedWeekStart = newWeekStart; currentData.weekStart = newWeekStart; currentData.missions = cached;
      renderNotebook(document.getElementById("tab-content"));
      refreshWeekQuietly(newWeekStart);
      return;
    }
    weekNavBusy = true;
    renderNotebook(document.getElementById("tab-content"));
    const seq = weekSeq;
    try {
      const data = await fetchMissionsOnly(newWeekStart);
      if (!data.ok) throw new Error(data.error || "failed");
      if (seq === weekSeq) weekCache[newWeekStart] = data.missions;
      selectedWeekStart = data.weekStart; currentData.weekStart = data.weekStart; currentData.missions = data.missions;
    } catch (err) { showToast("週の切り替えに失敗しました。もう一度お試しください。"); }
    finally { weekNavBusy = false; renderNotebook(document.getElementById("tab-content")); }
  }

  async function handleAddMission(e) {
    e.preventDefault();
    const day = document.getElementById("mission-day").value;
    const repeat = document.getElementById("mission-repeat").value;
    const category = document.getElementById("mission-category").value;
    const contentInput = document.getElementById("mission-content");
    const content = contentInput.value.trim();
    const errorEl = document.getElementById("mission-error");
    const btn = document.getElementById("mission-submit-btn");
    errorEl.classList.remove("show");
    if (!content) return showFieldError(errorEl, "内容を入力してください");
    lastSelectedDay = day;
    btn.disabled = true; btn.textContent = "追加中...";
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "addMission", studentId, day, category, content, weekStart: selectedWeekStart, repeat }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      invalidateWeekCache();
      if (Array.isArray(result.missions)) {
        // 繰り返し設定のときは、同じ週の残りの日の分もまとめて返ってくる
        currentData.missions = result.missions;
      } else {
        currentData.missions = currentData.missions || [];
        currentData.missions.push({ id: result.id, studentId, weekStart: (selectedWeekStart || currentData.weekStart).replace(/-/g, ""), day, category, content, completed: false, completedAt: "", recurringId: result.recurringId || "" });
      }
      contentInput.value = "";
      document.getElementById("mission-repeat").value = "";
      renderNotebook(document.getElementById("tab-content"));
      showToast(repeat ? "ミッションを追加しました(繰り返し設定あり)" : "ミッションを追加しました");
    } catch (err) { showFieldError(errorEl, err.message || "追加に失敗しました。もう一度お試しください。"); }
    finally { btn.disabled = false; btn.textContent = "ミッションを追加"; }
  }

  async function saveMissionPreset() {
    const category = document.getElementById("mission-category").value;
    const contentInput = document.getElementById("mission-content");
    const content = contentInput.value.trim();
    if (!content) { showToast("登録する内容を先に入力してください"); return; }
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "addMissionPreset", studentId, category, content }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      if (!result.alreadyExists) {
        currentData.missionPresets = currentData.missionPresets || [];
        currentData.missionPresets.push({ id: result.id, category: result.category, content: result.content });
      }
      renderNotebook(document.getElementById("tab-content"));
      showToast("よく使う項目に登録しました");
    } catch (err) { showToast("登録に失敗しました。もう一度お試しください。"); }
  }

  async function deleteMissionPreset(id) {
    const prevPresets = currentData.missionPresets;
    currentData.missionPresets = (currentData.missionPresets || []).filter((p) => p.id !== id);
    renderNotebook(document.getElementById("tab-content"));
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "deleteMissionPreset", studentId, id }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      showToast("削除しました");
    } catch (err) {
      currentData.missionPresets = prevPresets;
      renderNotebook(document.getElementById("tab-content"));
      showToast("削除に失敗しました。もう一度お試しください。");
    }
  }

  function showGardenGrowthMessage(prevGarden, newGarden) {
    if (!prevGarden || !newGarden) return;
    if (newGarden.readyCount > prevGarden.readyCount) { showToast("🍇 果実が実った!「畑」タブで確認してみよう"); return; }
    if (newGarden.nutrientCount > prevGarden.nutrientCount) {
      if (newGarden.nutrientCount === 1) showToast("🌱 芽が出たよ");
      else if (newGarden.nutrientCount === 2) showToast("🌿 つぼみになったよ");
    }
  }
  // ---------- ミッションを消す(この日だけ / これ以降すべて) ----------
  function isMissionDone(m) { return m.completed === true || m.completed === "TRUE" || m.completed === "true"; }
  function missionDateYMD(m) {
    const w = String(m.weekStart);
    return addDaysToYMD(`${w.slice(0, 4)}-${w.slice(4, 6)}-${w.slice(6, 8)}`, Math.max(DAYS.indexOf(m.day), 0));
  }
  function openDeleteMissionModal(id) {
    const m = (currentData.missions || []).find((x) => x.id === id);
    if (!m) return;
    const modal = document.getElementById("advice-modal");
    const isRecurring = !!m.recurringId;
    modal.innerHTML = `
      <div class="advice-backdrop" id="delete-backdrop"></div>
      <div class="advice-sheet">
        <p class="advice-sheet-title" style="color:#C0392B;">ミッションを消しますか?</p>
        <p class="delete-target">${m.day}曜日(${formatMD(missionDateYMD(m))}) ${escapeHtml(m.content)}</p>
        ${isRecurring ? `
          <button type="button" class="delete-opt-btn" id="delete-one-btn">この日だけ消す</button>
          <p class="delete-hint">この日の分だけ消します。ほかの日の繰り返しは、そのまま続きます。</p>
          <button type="button" class="delete-opt-btn solid" id="delete-future-btn">これ以降すべて消す</button>
          <p class="delete-hint">この日から先の繰り返しを、すべて止めて消します。完了したものと、これより前の分は残ります。</p>
        ` : `
          <button type="button" class="delete-opt-btn solid" id="delete-one-btn">消す</button>
        `}
        <button type="button" class="delete-cancel-btn" id="delete-cancel-btn">やめる</button>
      </div>
    `;
    modal.classList.add("show");
    document.getElementById("delete-backdrop").addEventListener("click", closeAdviceModal);
    document.getElementById("delete-cancel-btn").addEventListener("click", closeAdviceModal);
    document.getElementById("delete-one-btn").addEventListener("click", () => deleteMission(id, "one"));
    const futureBtn = document.getElementById("delete-future-btn");
    if (futureBtn) futureBtn.addEventListener("click", () => deleteMission(id, "future"));
  }
  async function deleteMission(id, scope) {
    closeAdviceModal();
    const list = currentData.missions || [];
    const m = list.find((x) => x.id === id);
    if (!m) return;
    // 先に画面から消して(待ち時間をなくす)、裏で保存する。失敗したら元に戻す
    const snapshot = list.slice();
    const removeIds = new Set([id]);
    if (scope === "future" && m.recurringId) {
      const targetDate = missionDateYMD(m);
      list.forEach((x) => {
        if (x.recurringId === m.recurringId && x.id !== id && !isMissionDone(x) && missionDateYMD(x) >= targetDate) removeIds.add(x.id);
      });
    }
    currentData.missions = list.filter((x) => !removeIds.has(x.id));
    invalidateWeekCache();
    renderNotebook(document.getElementById("tab-content"));
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "deleteMission", studentId, id, scope }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      showToast(scope === "future" ? "これ以降のミッションを消しました" : "ミッションを消しました");
    } catch (err) {
      currentData.missions = snapshot;
      renderNotebook(document.getElementById("tab-content"));
      showToast(err.message || "消せませんでした。もう一度お試しください。");
    }
  }

  function editMissionContent(id, currentContent) {
    const newContent = window.prompt("内容を修正してください(この1件だけが変わります)", currentContent || "");
    if (newContent === null) return;
    const trimmed = newContent.trim();
    if (!trimmed) return;
    // 変更がなければ何もしない(通信もメッセージも出さない)
    if (trimmed === String(currentContent || "").trim()) return;
    handleEditMissionRequest(id, trimmed);
  }

  async function handleEditMissionRequest(id, content) {
    const m = (currentData.missions || []).find((x) => x.id === id);
    if (!m) return;
    if (String(m.content || "").trim() === String(content || "").trim()) return;
    // 先に画面を書き換えて(待ち時間をなくす)、裏で保存する。失敗したら元に戻す
    const prevContent = m.content;
    invalidateWeekCache();
    m.content = content;
    renderNotebook(document.getElementById("tab-content"));
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "editMission", studentId, id, content }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      if (result.content) m.content = result.content;
      showToast("内容を修正しました");
    } catch (err) {
      m.content = prevContent;
      renderNotebook(document.getElementById("tab-content"));
      showToast(err.message || "修正に失敗しました。もう一度お試しください。");
    }
  }

  async function toggleMission(id) {
    const m = (currentData.missions || []).find((x) => x.id === id);
    if (!m) return;
    const prevCompleted = m.completed === true || m.completed === "TRUE" || m.completed === "true";
    const prevGarden = currentData.garden ? { ...currentData.garden } : null;
    invalidateWeekCache();
    m.completed = !prevCompleted;
    renderNotebook(document.getElementById("tab-content"));
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "toggleMission", studentId, id }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      m.completed = result.completed;
      currentData.garden = result.garden;
      renderNotebook(document.getElementById("tab-content"));
      if (m.completed) showGardenGrowthMessage(prevGarden, result.garden);
    } catch (err) {
      m.completed = prevCompleted;
      renderNotebook(document.getElementById("tab-content"));
      showToast("更新に失敗しました。もう一度お試しください。");
    }
  }

  // ---------- 畑タブ ----------
  function renderGardenStage() {
    const garden = currentData.garden || { nutrientCount: 0, readyCount: 0, missionsPerStage: 3 };
    const n = garden.nutrientCount;
    let iconSvg = "", statusText = NOTEBOOK_ENABLED ? "まだ何も植えていません。学習手帳でミッションを完了すると育ち始めます" : "まだ何も植えていません。学習手帳が始まったら、ミッションを完了すると育ち始めます";
    if (n === 1) { iconSvg = SPROUT_ICON; statusText = "芽が出た!"; }
    else if (n === 2) { iconSvg = BUD_ICON; statusText = "つぼみがふくらんできた"; }
    else if (garden.readyCount > 0 && n === 0) { statusText = "次の株を育て始めています"; }

    let html = `
      <div class="garden-stage-wrap">
        <div class="garden-stage-bg">${FIELD_BG_SVG}</div>
        <div class="garden-stage-fg">${iconSvg}</div>
      </div>
      <p class="garden-status">${statusText}</p>
    `;
    if (garden.readyCount > 0) {
      html += `<div class="ready-row">${Array(garden.readyCount).fill(0).map(() => `<div class="ready-icon">${MYSTERY_ICON}</div>`).join("")}</div>`;
      html += `<button id="harvest-btn" class="field-harvest">🎁 ${garden.readyCount}個をまとめて収穫する</button>`;
    }
    return html;
  }

  function renderGarden(el) {
    const harvests = currentData.harvests || [];
    const totalCount = currentData.harvestsTotalCount || 0;
    const counts = {}; FRUIT_LIST.forEach((f) => (counts[f] = 0));
    const rareCounts = {}; RARE_NAMES.forEach((n) => (rareCounts[n] = 0));
    harvests.forEach((h) => {
      const stripped = h.fruit.indexOf("rare ") === 0 ? h.fruit.slice(5) : h.fruit;
      if (rareCounts.hasOwnProperty(stripped)) { rareCounts[stripped] += 1; return; }
      const emoji = FRUIT_LIST.find((f) => h.fruit.indexOf(f) === 0);
      if (emoji) counts[emoji] += 1;
    });

    el.innerHTML = `
      <div class="garden-switch">
        <button class="gs-garden" id="gs-garden"><b>🌾 畑</b><small>果実を育てて収穫</small></button>
        <button class="gs-rank" id="gs-rank"><b>🏅 階級</b><small>バッジを集めてランクアップ</small></button>
      </div>
      <div id="sec-garden" class="section-banner garden"><span class="sb-ico">🌾</span><div><b>畑</b><small>ミッションで育てて、果実を収穫しよう</small></div></div>
      <div class="card">
        ${renderGardenStage()}
      </div>
      <div class="card info-card">
        <p class="info-title">収穫でもらえるバッジ</p>
        <p>果実を収穫すると階級バッジと交換できます。ノーマル果実10個で銅バッジ1つ、レア果実1個で銀バッジ1つ、激レア果実1個で金バッジ1つと自動で交換されます。階級が上がると収穫できる果実も増えていくので、たくさんバッジを集めよう。</p>
        <p style="color: var(--brand); font-weight: 600;">これまでの収穫数: ${totalCount}個</p>
      </div>
      <div class="card">
        <p class="section-title" style="margin-top:0;">これまでの収穫(ノーマル果実)</p>
        <div class="fruit-grid">
          ${FRUIT_LIST.map((f) => counts[f] > 0 ? `<div class="fruit-cell">${f}<span class="count">×${counts[f]}</span></div>` : `<div class="fruit-cell mystery">❔<span class="count">???</span></div>`).join("")}

      <div class="card">

          const stripped = isRare ? h.fruit.slice(5) : h.fruit;
          const iconHtml = isRare ? `<span class="history-fruit-icon" style="display:inline-block;">${RARE_ICONS[stripped] || ""}</span>` : "";

    document.getElementById("gs-rank").addEventListener("click", () => goTo("sec-rank"));

    if (harvestBtn) harvestBtn.addEventListener("click", harvestGarden);
  }

  async function harvestGarden() {
    const btn = document.getElementById("harvest-btn");
    if (btn) { btn.disabled = true; btn.textContent = "収穫中..."; }
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "harvestGarden", studentId }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");

      currentData.garden = result.garden;
      currentData.harvests = currentData.harvests || [];
      const now = new Date().toISOString();
      result.fruits.forEach((f) => currentData.harvests.unshift({ studentId, fruit: f, harvestedAt: now }));
      currentData.harvestsTotalCount = (currentData.harvestsTotalCount || 0) + result.fruits.length;

      renderGarden(document.getElementById("tab-content"));
      showHarvestCelebration(result.fruits, result.badgesAwarded);
      syncRankOnly();
    } catch (err) {
      showToast("収穫に失敗しました。もう一度お試しください。");
      if (btn) { btn.disabled = false; btn.textContent = "🎁 まとめて収穫する"; }
    }
  }

  // ---------- 階級(畑タブの下に表示する) ----------
  function renderRanksHtml() {
    const rank = currentData.rank || { rankName: "雑用", pointsInCycle: 0, nextRankName: null, pointsToNext: 0, totalPoints: 0, className: "見習いクラス" };
    const isUra = rank.rankName.indexOf("裏・") === 0;
    const style = CLASS_CARD_STYLES[rank.className] || CLASS_CARD_STYLES["見習いクラス"];
    let html = `
      <div class="rank-current" style="${style.box}">
        <div class="rank-medal">${medalIcon(rank.className, 70)}</div>
        <p class="rank-name" style="color:${style.text}">${rank.rankName}</p>
        <p class="rank-next" style="color:${style.next}">${rank.nextRankName ? `次は「${rank.nextRankName}」まで あと${rank.pointsToNext}ポイント` : "最高位に到達しています"}</p>
      </div>
      <div class="card">
    `;
    let lastCls = "";
    RANKS.forEach((r) => {
      if (r.cls !== lastCls) { html += `<div class="rank-class-title">${medalIcon(r.cls, 22)}<span>${r.cls}</span></div>`; lastCls = r.cls; }
      const displayName = isUra ? "裏・" + r.name : r.name;
      const isCurrent = displayName === rank.rankName;
      html += `<div class="rank-row ${isCurrent ? "current" : ""}"><span>${displayName}</span><span class="pt">${r.threshold}pt</span></div>`;
    });
    html += `</div>`;
    return html;
  }

  // ---------- スケジュールタブ ----------
  const SCHEDULE_PERIODS = ["1限", "2限", "3限", "4限", "5限", "6限"];
  const SCHEDULE_TIMES = ["13:00〜14:20", "14:30〜15:50", "16:00〜17:20", "17:30〜18:50", "19:00〜20:20", "20:30〜21:50"];
  const SCHEDULE_DOW = ["日", "月", "火", "水", "木", "金", "土"];

  // 講習カウンター（申込・設定・残りコマ数）。画面で選んでいる月が 冬期=12〜2月、夏期=7〜9月、春期=3〜4月 のときだけ表示する
  const KOSHU_SEASON_MONTHS = { "冬": [12, 1, 2], "夏": [7, 8, 9], "春": [3, 4] };
  const KOSHU_SUBJECT_NAMES = { "英": "英語", "数": "数学", "国": "国語", "理": "理科", "社": "社会" };
  function koshuCounterHtml(viewMonth) {
    const seasons = currentData.koshuCounter || [];
    const nowMonth = Number(viewMonth) || (new Date().getMonth() + 1);
    let html = "";
    seasons.forEach((s) => {
      const months = KOSHU_SEASON_MONTHS[s.season];
      if (!months || months.indexOf(nowMonth) === -1 || !s.rows || s.rows.length === 0) return;
      html += `<div class="card">`;
      html += `<p class="section-title" style="margin-top:0;">${escapeHtml(s.season)}期講習のコマ数</p>`;
      if (s.updatedAt) html += `<p class="schedule-updated-note">最終更新:${formatDate(s.updatedAt)}</p>`;
      html += `<table class="koshu-table"><thead><tr><th>科目</th><th>申込</th><th>設定済み</th><th>残り</th></tr></thead><tbody>`;
      s.rows.forEach((r) => {
        const raw = String(r.subject || "");
        const body = raw.charAt(0) === s.season ? raw.slice(1) : raw;
        const name = KOSHU_SUBJECT_NAMES[body] || body || raw;
        html += `<tr><td class="koshu-subject">${escapeHtml(name)}</td><td>${escapeHtml(r.mosikomi)}</td><td>${escapeHtml(r.settei)}</td><td class="koshu-nokori">${escapeHtml(r.nokori)}</td></tr>`;
      });
      html += `</tbody></table>`;
      html += `<p class="koshu-note">「設定済み」は時間割が決まったコマ数、「残り」はまだ日時が決まっていないコマ数です。</p>`;
      html += `</div>`;
    });
    return html;
  }

  function renderSchedule(el) {
    const months = currentData.scheduleMonths || [];
    if (months.length === 0) {
      el.innerHTML = `
        <div class="card">
          <div class="schedule-card-header">
            <p class="section-title" style="margin-top:0;">スケジュール</p>
            <button id="force-refresh-btn" class="force-refresh-btn" title="最新の状態に更新">⟳ 更新</button>
          </div>
          <p class="empty">スケジュールはまだ登録されていません</p>
        </div>
      `;
      const refreshBtnEmpty = document.getElementById("force-refresh-btn");
      if (refreshBtnEmpty) refreshBtnEmpty.addEventListener("click", forceRefreshApp);
      return;
    }
    if (selectedScheduleMonthIndex >= months.length) selectedScheduleMonthIndex = 0;
    const monthData = months[selectedScheduleMonthIndex];
    const { year, monthNum, rows, updatedAt } = monthData;

    const daysInMonth = new Date(year, monthNum, 0).getDate();
    const cellMap = {};
    rows.forEach((r) => { cellMap[`${r.date}_${r.period}`] = r; });

    const todayCompact = (() => {
      const d = new Date();
      return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    })();

   let html = `
      <div class="card grades-guide-card">
        <p class="grades-guide-title">スケジュールの見かた</p>
        <p class="grades-guide-item">スケジュールは「当月」と「翌月」をご確認いただけます。プルダウンで確認したい月を選択してください。また、授業日時が変更になった箇所は黄色く表示されます。</p>
        <p class="grades-guide-item" style="font-weight:700;color:#D93025;">「⟳ 更新」ボタンを押してから、最新のスケジュールをご確認ください。</p>
      </div>
    `;
    html += `<div class="card">`;
    html += `<div class="schedule-card-header">
      <p class="section-title" style="margin-top:0;">スケジュール</p>
      <button id="force-refresh-btn" class="force-refresh-btn" title="最新の状態に更新">⟳ 更新</button>
    </div>`;
    html += `<div class="field schedule-month-select">
      <select id="schedule-month-select">
        ${months.map((m, i) => `<option value="${i}" ${i === selectedScheduleMonthIndex ? "selected" : ""}>${m.monthNum}月</option>`).join("")}
      </select>
    </div>`;
    if (updatedAt) html += `<p class="schedule-updated-note">最終更新:${formatDate(updatedAt)}</p>`;

    html += `<div class="schedule-scroll"><table class="schedule-table"><colgroup><col class="schedule-col-date" />${SCHEDULE_PERIODS.map(() => `<col />`).join("")}</colgroup>`;
    html += `<thead><tr><th rowspan="2">日付</th>${SCHEDULE_PERIODS.map((p) => `<th>${p}</th>`).join("")}</tr>`;
    html += `<tr>${SCHEDULE_TIMES.map((t) => `<th class="schedule-time-row">${t}</th>`).join("")}</tr></thead><tbody>`;

    for (let day = 1; day <= daysInMonth; day++) {
      const dateCompact = `${year}${String(monthNum).padStart(2, "0")}${String(day).padStart(2, "0")}`;
      const dowIndex = new Date(year, monthNum - 1, day).getDay();
      const dow = SCHEDULE_DOW[dowIndex];
      const isToday = dateCompact === todayCompact;
      const dowStyle = dowIndex === 0 ? ' style="color:#C0392B;"' : "";
      html += `<tr class="${isToday ? "schedule-today" : ""}"><td class="schedule-daycell"${dowStyle}>${monthNum}/${day}<br>(${dow})</td>`;
      SCHEDULE_PERIODS.forEach((period) => {
        const cell = cellMap[`${dateCompact}_${period}`];
        if (!cell) { html += `<td></td>`; return; }
        const isChanged = cell.changed === true || cell.changed === "TRUE" || cell.changed === "true";
        html += `<td class="${isChanged ? "schedule-cell-changed" : ""}">${escapeHtml(cell.subject)}</td>`;
      });
      html += `</tr>`;
    }

    html += `</tbody></table></div>`;
    html += `<p class="schedule-legend"><span class="schedule-legend-swatch"></span>前回から日時が変更になったコマ</p>`;
    html += `</div>`;

    html += koshuCounterHtml(monthNum);

    html += `<div class="card info-card">`;
    html += `<p class="info-title">注意</p>`;
    html += `<ol class="schedule-notes-list">`;
    html += `<li>授業をお休みされる場合は授業開始の2時間前までにご連絡ください。</li>`;
    html += `<li>事前のご連絡のないお休み、また振替授業をお休みされた場合は振替の対象外となりますのでご注意ください。</li>`;
    html += `<li>講師の都合で授業日時を変更させていただく場合がございます。予めご了承ください。</li>`;
    html += `</ol>`;
    html += `</div>`;

    el.innerHTML = html;

    const monthSelect = document.getElementById("schedule-month-select");
    if (monthSelect) {
      monthSelect.addEventListener("change", (e) => {
        selectedScheduleMonthIndex = Number(e.target.value);
        renderSchedule(document.getElementById("tab-content"));
      });
    }
    const refreshBtn = document.getElementById("force-refresh-btn");
    if (refreshBtn) refreshBtn.addEventListener("click", forceRefreshApp);
  }

  function ucMethodsFor(k, fac) {

    const short = fac.replace(/（.*?）/g, "").replace(/学部$|学域$/, "");
    return rows.filter((r) => {

  // 保存された志望校データ → カレンダー用の予定 [{d, t:"ex"|"rs", txt, who}]
  function ucEventsFromShibo(data, who) {

      const subj = data.ct.subj || [];

      const pick = (groups) => subj.filter((x) => UC_CT_SUBJ.some(([g, list]) => groups.includes(g) && list.includes(x))).join("・");
      if (d1 || !subj.length) ev.push({ d: "1/16", t: "ex", who, univ: "共テ", txt: `共通テスト 1日目${d1 ? `（${pick(UC_CT_DAY1)}）` : "（科目未選択）"}`, rank: "" });

    }
    cards.forEach((c, ci) => {
      const rank = `第${ci + 1}`;
      if (c.u === UC_OTHER) {
        const f = c.free || {};
        const name = f.name || "自由入力の大学";
        const d1 = ucYmdToMd(f.date), d2 = ucYmdToMd(f.res);

        return;
      }
      const u = UC_UM[c.u]; if (!u) return;
      const facName = c.fac === UC_OTHER ? (c.facFree || "") : (c.fac || "");

        const date = mm.date || (r.ex.length === 1 ? r.ex[0] : "");

    `;

  // 日付をタップしたときの「受験する生徒／合格発表がある生徒」のカード表示
  function ucPersonalDayHtml(mine, opts) {
    const rowHtml = (e) => `<div class="uc-pc-row">${e.rank ? `<span class="uc-pc-rank">${ucEsc(e.rank)}志望</span>` : ""}<span>${ucEsc(e.txt)}</span></div>`;

        return `<p class="uc-pc-h ${t}">${title}</p><div class="uc-pc ${t}">${list.map(rowHtml).join("")}</div>`;
      }
      const names = [...new Set(list.map((e) => e.who))];
      return `<p class="uc-pc-h ${t}">${title}（${names.length}人）</p>` + names.map((nm) => `<div class="uc-pc ${t}"><div class="uc-pc-name">${ucEsc(nm)}</div>${list.filter((e) => e.who === nm).map(rowHtml).join("")}</div>`).join("");
    };
    return sec("ex", opts.showNames ? "この日に受験する生徒" : "この日の受験") + sec("rs", opts.showNames ? "この日に合格発表がある生徒" : "この日の合格発表");

  function ucDetailHtml(personal, opts, showUniv) {
    const key = ucCal.day;

      if (opts.personalTab && personal.length) {
        const rows = personal.filter((e) => Number(e.d.split("/")[0]) === ucCal.month);
        return `<h3>${ucCal.month}月の${ucEsc(opts.personalTab)}</h3>${rows.length ? rows.map((e) => `<div class="uc-plan-row ${e.t === "rs" ? "rs" : ""}"><span class="d">${e.d}（${ucWd(e.d)}）</span><span>${opts.showNames ? `<b>${ucEsc(e.who)}</b> ` : ""}${ucEsc(e.txt)}</span></div>`).join("") : `<p class="uc-sub">この月の予定はありません。</p>`}<p class="uc-sub" style="margin-top:8px;">日付をタップすると、その日の詳しい内容が出ます。</p>`;
      }
      return `<h3>日付をタップしてください</h3><p class="uc-sub">その日に入試や合格発表がある大学・学部・方式が出ます。</p>`;

    if (showUniv) {
      const pick = (fn) => UC_R.filter((r) => (ucCal.univ === "all" || r.k === ucCal.univ) && fn(r));
      const ex = pick((r) => r.ex.includes(key)), rs = pick((r) => r.res === key);
      const block = (rows, isRs) => UC_U.filter((u) => rows.some((r) => r.k === u.key)).map((u) => `<div class="uc-item"><b class="${isRs ? "uc-red" : ""}">${u.name}</b>${rows.filter((r) => r.k === u.key).map((r) => `<div>${ucEsc(r.method)}${r.chk ? " ※" : ""}${isRs ? (r.ex.length ? `（試験日 ${r.ex.join("・")}）` : "") : (r.res ? `（発表 ${r.res}）` : "")}<span class="uc-fac">${ucEsc(r.fac)}${r.note ? "｜" + ucEsc(r.note) : ""}</span></div>`).join("")}</div>`).join("");

  function ucCloseOverlay() {

  // 読み込みを速くする工夫：
  //  ・アプリを開いた時点で、裏で志望校データを先に取りに行っておく
  //  ・前回の内容をこの端末に覚えておき、画面はすぐ出して、最新の内容は裏で確認する
  const UC_CACHE_KEY = "uc_shibo_cache_v1_";

  let ucShiboPromise = null;  // 取りに行っている途中なら同じものを使う
  let ucSaveCount = 0;
  function ucReadCache() { try { const s = localStorage.getItem(UC_CACHE_KEY + studentId); return s ? JSON.parse(s) : null; } catch (err) { return null; } }
  function ucWriteCache(d) { try { localStorage.setItem(UC_CACHE_KEY + studentId, JSON.stringify(d)); } catch (err) {} }
  function ucFetchShibo() {
    if (ucShiboPromise) return ucShiboPromise;
    const startSave = ucSaveCount;
    ucShiboPromise = ucPost({ action: "getShibo", studentId }).then((data) => {
      ucShiboPromise = null;
      if (!data.ok) throw new Error(data.error || "load failed");
      if (ucSaveCount !== startSave) return ucShibo; // 取りに行っている間に保存した場合は保存結果を優先
      ucShibo = data; ucShiboFresh = true; ucWriteCache(data);
      return data;
    }, (err) => { ucShiboPromise = null; throw err; });
    return ucShiboPromise;
  }
  async function ucLoadShibo(force) {
    if (ucShibo && ucShiboFresh && !force) return ucShibo;
    return ucFetchShibo();
  }
