<script>
  (function () {
    try {
      var params = new URLSearchParams(window.location.search);
      var STORAGE_KEY_PID = "connect-parent-id";
      var urlPid = params.get("pid");
      var pid = urlPid || localStorage.getItem(STORAGE_KEY_PID);
      if (!pid) return;
      var base = window.location.origin + window.location.pathname;
      var manifest = {
        name: "CONNEC＋保護者用 | 個別指導塾コネクト", short_name: "CONNEC＋保護者用",
        start_url: base + "?pid=" + pid, scope: base, display: "standalone",
        orientation: "portrait", background_color: "#FFF6EC", theme_color: "#D9720B", lang: "ja",
        icons: [
          { src: window.location.origin + window.location.pathname.replace("parent.html", "") + "icons/icon-192.png", sizes: "192x192", type: "image/png", purpose: "any maskable" },
          { src: window.location.origin + window.location.pathname.replace("parent.html", "") + "icons/icon-512.png", sizes: "512x512", type: "image/png", purpose: "any maskable" },
        ],
      };
      var dataUri = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest));
      var link = document.createElement("link");
      link.rel = "manifest"; link.href = dataUri;
      document.head.appendChild(link);
    } catch (err) {}
  })();
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --ink: #1F2A44; --paper: #FFF6EC; --card: #FFFFFF; --line: #E8D9C6;
    --brand: #D9720B; --brand-soft: #FBE7D0;
    --growth: #3E7C59; --growth-soft: #E3EEE7;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding: max(20px, env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom)); min-height: 100vh; }

  .year-open-btn { display: block; width: 100%; margin: 0 0 12px; padding: 12px; border: 1.5px solid var(--brand); border-radius: 12px; background: var(--card); color: var(--brand); font-size: 14.5px; font-weight: 700; font-family: inherit; }
  .year-sticky-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin: -4px -16px 12px; padding: 8px 16px 8px; background: var(--paper); border-bottom: 1px solid var(--line); }
  .year-safe-cover { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px); background: var(--paper); z-index: 21; }
  .year-bar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  .year-guide p { margin: 0; }
  .year-guide-title { font-weight: 700; color: var(--brand); margin-bottom: 2px !important; font-size: 12.5px; }
  .year-back-btn { background: none; border: none; color: var(--brand); font-size: 14.5px; font-weight: 700; font-family: inherit; padding: 6px 0; white-space: nowrap; }
  #year-month-select { flex: 0 0 auto; font-size: 14px; font-family: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
  .year-updated { font-size: 11.5px; color: var(--muted); margin: 10px 0 0; text-align: right; }
  .year-legend { display: flex; flex-wrap: wrap; gap: 3px 11px; font-size: 11px; color: var(--muted); margin: 7px 0 0; }

  .yl-box { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); }

  .yl-spill { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--amber); background: var(--amber-soft); border-radius: 4px; padding: 1px 4px; }
  .year-card { padding: 14px 12px 12px; scroll-margin-top: calc(var(--year-sticky-h, 150px) + env(safe-area-inset-top, 0px) + 8px); }
  .year-month-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 10px; }

  /* ===== 大学入試カレンダー・志望校（高校生向け, v33で追加） ===== */

  .uc-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--card); }
  .uc-dow { font-size: 11px; text-align: center; padding: 3px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); background: var(--paper); }
  .uc-day { min-height: 64px; border: none; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2px 2px 4px; text-align: left; background: var(--card); font-family: inherit; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .uc-day.empty { background: var(--paper); cursor: default; }
  .uc-day.wk { background: var(--paper); }
  .uc-day.sel { box-shadow: inset 0 0 0 2px var(--brand); }
  .uc-day.today .uc-dn { background: var(--brand); color: #fff; border-radius: 4px; padding: 0 3px; }
  .uc-dn { font-size: 11.5px; font-weight: 700; align-self: flex-start; font-variant-numeric: tabular-nums; }
  .uc-l { font-size: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em; }
  .uc-l.rs { color: #C0392B; }
  .uc-l.ct { color: var(--brand); font-weight: 700; }
  .uc-l.me { font-weight: 700; }
  .uc-l.me::before { content: "★"; color: var(--gold); }
  .uc-l.more { color: var(--muted); }
  .uc-detail { margin-top: 12px; }
  .uc-detail h3 { font-size: 16px; margin: 0 0 6px; }
  .uc-sec-h { font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 2px; }
  .uc-sec-h.rs { color: #C0392B; }
  .uc-item { border-top: 1px dashed var(--line); padding: 6px 0; font-size: 13px; line-height: 1.5; }
  .uc-item b { font-weight: 700; }
  .uc-item .uc-fac { display: block; font-size: 11.5px; color: var(--muted); }
  .uc-note { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin-top: 12px; }
  .uc-plan-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 6px; font-size: 12.5px; padding: 4px 0; border-top: 1px dashed var(--line); }
  .uc-plan-row:first-of-type { border-top: none; }
  .uc-plan-row .d { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .uc-plan-row.rs { color: #C0392B; }
  .uc-warn { background: #FDECEA; color: #C0392B; border-radius: 8px; padding: 6px 9px; font-size: 12px; font-weight: 600; margin-top: 8px; }
  .uc-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .uc-rank { font-family: 'Zilla Slab', serif; font-size: 17px; font-weight: 700; color: var(--brand); }
  .uc-mini { border: none; background: none; color: var(--muted); font-family: inherit; font-size: 12px; padding: 4px 2px; cursor: pointer; }
  .uc-field { margin-bottom: 9px; }
  .uc-field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
  .uc-field select, .uc-field input { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px; font-family: inherit; background: #fff; color: var(--ink); box-sizing: border-box; }
  .uc-field select:disabled { background: #F6F1EA; color: #B4A898; }
  .uc-free { background: var(--brand-soft); border-radius: 10px; padding: 10px; margin-bottom: 9px; }
  .uc-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .uc-meth { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 6px; background: #FFFCF8; }
  .uc-meth .uc-two { grid-template-columns: minmax(0, 1fr) 108px; }
  .uc-mres { font-size: 11.5px; color: #C0392B; margin-top: 2px; }
  .uc-add { width: 100%; border: 1.5px dashed var(--brand); background: transparent; color: var(--brand); border-radius: 10px; padding: 9px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .uc-subj { display: flex; flex-wrap: wrap; gap: 5px; }
  .uc-subj button { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 999px; padding: 5px 10px; font-family: inherit; font-size: 12.5px; cursor: pointer; }
  .uc-subj button.on { background: #2A5FB4; border-color: #2A5FB4; color: #fff; }
  .uc-save { width: 100%; border: none; background: var(--brand); color: #fff; border-radius: 12px; padding: 14px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .uc-save:disabled { opacity: .6; }
  .uc-hist { font-size: 12px; border-top: 1px dashed var(--line); padding: 6px 0; line-height: 1.5; }
  .uc-hist b { font-variant-numeric: tabular-nums; }
  .uc-st { border-top: 1px dashed var(--line); padding: 8px 0; font-size: 13px; }
  .uc-st-name { font-weight: 700; }
  .uc-st ul { margin: 2px 0 0; padding-left: 1.1em; }
  .uc-st li { font-size: 12.5px; line-height: 1.55; }
</style>
</head>
<body>

<div id="app"><div class="loading-screen"><p class="loading-title">CONNEC＋</p><p class="loading-sub">『自分ひとりで勉強できる力と姿勢を育む』</p></div></div>
<div id="toast-container"></div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbzLZBA7mn6gGj0VrTIF6ztWv50v0W3syRwdl5nyg5Xq0c94iAef8gpLGZiJpZr2B4rggQ/exec";
  const LOADING_TEXT = `<p class="loading-title">CONNEC＋</p><p class="loading-sub">『自分ひとりで勉強できる力と姿勢を育む』</p>`;

  const SUBJECTS = ["国語", "社会", "数学", "理科", "音楽", "美術", "保体", "技家", "英語"];
  const MAIN5_SUBJECTS = ["国語", "社会", "数学", "理科", "英語"];
  const TEST_NAMES = [
    "1学期中間テスト", "1学期期末テスト", "2学期中間テスト", "2学期期末テスト", "学年末テスト",
    "第1回実力テスト（6月）", "第2回実力テスト（9月）", "第3回実力テスト（11月）", "第4回実力テスト（1月）",
  ];
  const HS_TEST_NAMES = TEST_NAMES.slice(0, 5);
  // 定期テスト(0〜4)と実力テスト(5以降)は別系統
  const EXAM_CATEGORY_BREAK_INDEX = 5;
  // 内申点(中学生のみ):主要5教科×4+副教科×7.5=250点満点
  const NAISHIN_TERMS = ["1学期", "2学期", "学年末"];
  const NAISHIN_MAIN = ["国語", "社会", "数学", "理科", "英語"];
  const NAISHIN_SUB = ["音楽", "美術", "保体", "技家"];
  const HS_SUBJECT_GROUPS = ["英語", "数学", "国語", "理科", "社会"];
  const HS_SLOTS_PER_SUBJECT = 3;
  const HS_SLOT_KEYS = [];
  HS_SUBJECT_GROUPS.forEach((g) => { for (let i = 1; i <= HS_SLOTS_PER_SUBJECT; i++) HS_SLOT_KEYS.push(g + i); });
  const ES_SUBJECTS = ["国語", "社会", "算数", "理科", "英語"];
  const MOCK_EXAM_SLOT_LABELS = ["模試①", "模試②", "模試③", "模試④", "模試⑤", "模試⑥"];

  const params = new URLSearchParams(window.location.search);
  const STORAGE_KEY_PID = "connect-parent-id";
  const urlPid = params.get("pid");
  const parentId = urlPid || localStorage.getItem(STORAGE_KEY_PID);
  const appEl = document.getElementById("app");

  let currentData = null;
  let currentTab = "grades";
  let selectedScheduleMonthIndex = 0;
  let currentSid = null; // 兄弟姉妹がいる場合に、プルダウンで選んでいる生徒ID
  let naishinTerm = "1学期";
  let editingNaishin = false; // 内申点の「修正」を開いているか
  let editingTestName = null; // 現在「修正」を開いているテスト回(1つだけ開ける)

  function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function showToast(message) {
    const container = document.getElementById("toast-container");
    if (!container) return;
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = message;
    container.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 2500);
  }

  function formatDateTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  function formatDate(iso) { if (!iso) return ""; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; }

  function calcTotal(subjects, list) {
    const relevant = subjects.filter((s) => list.indexOf(s.subject) !== -1 && s.score !== null);
    if (relevant.length === 0) return null;
    return relevant.reduce((sum, s) => sum + Number(s.score), 0);
  }

  function currentTestNames() { return (currentData && currentData.isHighSchool) ? HS_TEST_NAMES : TEST_NAMES; }

  function getPreviousScore(subject, testName) {
    const testNames = currentTestNames();
    const idx = testNames.indexOf(testName);
    if (idx <= 0 || !currentData) return null;
    const catStart = idx >= EXAM_CATEGORY_BREAK_INDEX ? EXAM_CATEGORY_BREAK_INDEX : 0;
    if (idx === catStart) return null;
    const testsByName = {};
    (currentData.tests || []).forEach((t) => { testsByName[t.testName] = t; });
    for (let i = idx - 1; i >= catStart; i--) {
      const t = testsByName[testNames[i]];
      if (!t) continue;
      const s = t.subjects.find((s) => s.subject === subject);
      if (s && s.score !== null) return s.score;
    }
    return null;
  }

  async function init() {
    if (!parentId) {
      appEl.innerHTML = `<div class="id-error">専用リンクが正しくありません。<br />講師から送られたリンクからアクセスしてください。</div>`;
      return;
    }
    await loadAndRender();
  }

  async function fetchData() {
    let url = `${GAS_URL}?parentId=${encodeURIComponent(parentId)}`;
    if (currentSid) url += `&sid=${encodeURIComponent(currentSid)}`;
    const res = await fetch(url);
    return res.json();
  }

  async function loadAndRender() {
    if (!currentData) appEl.innerHTML = `<div class="loading-screen">${LOADING_TEXT}</div>`;
    let data;
    try { data = await fetchData(); }
    catch (err) { appEl.innerHTML = `<div class="id-error">通信に失敗しました。電波の良い場所でもう一度お試しください。</div>`; return; }
    if (!data.ok) { appEl.innerHTML = `<div class="id-error">リンクが無効です。講師に確認してください。</div>`; return; }
    if (urlPid) localStorage.setItem(STORAGE_KEY_PID, urlPid);

    currentData = data;
    currentSid = data.id || currentSid;
    if (data.isElementary && currentTab === "grades") currentTab = "schedule";
    renderShell();
    if (currentTab === "schedule" && currentData.hasUnreadSchedule) markScheduleSeen();
  }

  function switchTab(tab) {
    currentTab = tab;
    showYearView = false;
    editingTestName = null;
    renderShell();
    if (tab === "schedule" && currentData.hasUnreadSchedule) markScheduleSeen();
  }

  async function markScheduleSeen() {
    const months = currentData.scheduleMonths || [];
    let latest = null;
    months.forEach((m) => { if (m.updatedAt && (!latest || m.updatedAt > latest)) latest = m.updatedAt; });
    if (!latest) return;
    currentData.hasUnreadSchedule = false;
    renderShell();
    try {
      await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "markScheduleSeen", parentId, sid: currentSid, seenUpdatedAt: latest }) });
    } catch (err) {}
  }

  // ホーム画面に追加した状態(ブラウザの更新ボタンがない状態)でも、
  // キャッシュを消してから読み込み直すことで、最新版になっているか確認できるようにする
  async function forceRefreshApp() {
    const btn = document.getElementById("force-refresh-btn");
    if (btn) btn.textContent = "更新中…";
    try {
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((r) => r.unregister()));
      }
    } catch (err) {}
    location.reload();
  }

  function renderShell() {
    const data = currentData;
    const siblings = data.siblings || [];
    if (currentTab === "unical" && !data.isHighSchool) currentTab = "schedule";
    appEl.innerHTML = `
      <p class="eyebrow">個別指導塾コネクト 保護者用</p>
      <h1>CONNEC＋</h1>
      ${siblings.length > 1 ? `
      <div class="field" style="margin-bottom:12px;">
        <label for="sibling-select">お子様を選択</label>
        <select id="sibling-select">
          ${siblings.map((s) => `<option value="${s.id}" ${String(s.id) === String(data.id) ? "selected" : ""}>${escapeHtml(s.name)}</option>`).join("")}
        </select>
      </div>` : ""}
      <p class="student-name">${data.studentName} さん の保護者様</p>
      <div id="tab-content"></div>
      <nav class="tabbar">
        ${data.isElementary ? "" : `<button class="tab-btn ${currentTab === "grades" ? "active" : ""}" data-tab="grades"><span class="tab-icon">📊</span>成績表</button>`}
        <button class="tab-btn ${currentTab === "schedule" ? "active" : ""}" data-tab="schedule"><span class="tab-icon">📅</span>スケジュール${data.hasUnreadSchedule ? '<span class="tab-unread-dot"></span>' : ""}</button>
        ${data.isHighSchool ? `<button class="tab-btn ${currentTab === "unical" ? "active" : ""}" data-tab="unical"><span class="tab-icon">🎓</span>大学入試カレンダー</button>` : ""}
      </nav>
    `;
    document.querySelectorAll(".tab-btn").forEach((btn) => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
    const siblingSelect = document.getElementById("sibling-select");
    if (siblingSelect) {
      siblingSelect.addEventListener("change", (e) => {
        currentSid = e.target.value;
        editingNaishin = false;
        const contentEl = document.getElementById("tab-content");
        if (contentEl) contentEl.innerHTML = `<p class="empty">切り替え中...</p>`;
        siblingSelect.disabled = true;
        loadAndRender();
      });
    }
    const contentEl = document.getElementById("tab-content");
    if (currentTab === "grades") renderGrades(contentEl);
    else if (currentTab === "schedule") renderSchedule(contentEl);
    else if (currentTab === "unical") renderUnivCalendarParent(contentEl);
  }

  // ---------- 成績表タブ(閲覧+「修正」ボタンで全枠を開いて編集) ----------
  function renderGrades(el) {
    const isHS = !!(currentData && currentData.isHighSchool);
    const isES = !!(currentData && currentData.isElementary);
    const testNames = isHS ? HS_TEST_NAMES : TEST_NAMES;
    const tests = (currentData.tests || []).slice().sort((a, b) => testNames.indexOf(a.testName) - testNames.indexOf(b.testName));
    const subjectNames = currentData.subjectNames || {};

    el.innerHTML = `
      <div class="card grades-guide-card">
        <p class="grades-guide-title">保護者用アプリについて</p>
        <p class="grades-guide-item">お子様が入力した成績を確認いただけます。誤りがある場合は、各テストの「修正」ボタンから直接修正できます。</p>
      </div>
      ${(!isHS && !isES) ? '<div id="naishin-section"></div>' : ""}
      <p class="section-title">テストごとの記録</p>
      <div id="tests-list">${tests.length === 0 ? '<div class="card"><p class="empty">まだ記録がありません</p></div>' : ""}</div>
    `;

    const testsListEl = document.getElementById("tests-list");
    testNames.forEach((testName) => {
      const t = tests.find((x) => x.testName === testName);
      const card = document.createElement("div");
      card.className = "card test-card";
      const isEditing = editingTestName === testName;

      if (!t && !isEditing) {
        card.innerHTML = `
          <div class="test-header">
            <p class="test-name">${testName}</p>
            <button type="button" class="test-edit-btn" data-test-name="${testName}">修正</button>
          </div>
          <p class="empty" style="padding:10px 0;">まだ記録がありません</p>
        `;
        testsListEl.appendChild(card);
        return;
      }

      const photoSubmitted = !!(t && t.photo);
      let bodyHtml = "";
      if (t && !isEditing) {
        const filledSubjects = t.subjects.filter((s) => s.score !== null || s.average !== null || s.target !== null);
        let totalsHtml = "";
        if (!isHS) {
          const total5 = calcTotal(t.subjects, MAIN5_SUBJECTS);
          totalsHtml = `<div class="entry total"><div>5教科合計</div><div>${total5 !== null ? total5 + "点" : "-"}</div></div>`;
          if (!isES) {
            const total9 = calcTotal(t.subjects, SUBJECTS);
            totalsHtml += `<div class="entry total"><div>9教科合計</div><div>${total9 !== null ? total9 + "点" : "-"}</div></div>`;
          }
        }
        bodyHtml = `
          ${filledSubjects.length === 0 ? '<p class="empty" style="padding:10px 0;">まだ記録がありません</p>' : filledSubjects.map((s) => {
            const label = isHS ? escapeHtml(subjectNames[s.subject] || s.subject) : s.subject;
            return `
            <div class="entry">
              <div>${label}</div>
              <div style="text-align:right">
                ${s.score !== null ? `${s.score}点` : "-"}
                <span class="entry-meta">
                  ${s.target !== null ? `目標${s.target}点` : ""}
                  ${s.average !== null ? `${s.target !== null ? " / " : ""}平均${s.average}点` : ""}
                </span>
              </div>
            </div>`;
          }).join("")}
          ${totalsHtml}
          <div class="photo-row">
            <div>
              <span>成績表: <span class="badge ${photoSubmitted ? "done" : "pending"}">${photoSubmitted ? `提出済み(${formatDateTime(t.photo.submittedAt)})` : "未提出"}</span></span>
              ${photoSubmitted ? `<div style="margin-top:4px;"><a href="${t.photo.driveFileUrl}" target="_blank" rel="noopener" style="font-size:11px;color:var(--brand);text-decoration:underline;">写真を見る</a></div>` : ""}
            </div>
            <label class="photo-btn ${photoSubmitted ? "done" : ""}">
              ${photoSubmitted ? "写真を撮り直す" : "成績表を撮影"}
              <input type="file" accept="image/*" capture="environment" data-test-name="${testName}" class="photo-input" />
            </label>
          </div>
        `;
      } else if (isEditing) {
        bodyHtml = `<div class="test-edit-form">${renderEditForm(testName, t, isHS, subjectNames)}</div>`;
      }

      card.innerHTML = `
        <div class="test-header">
          <p class="test-name">${testName}</p>
          <button type="button" class="test-edit-btn ${isEditing ? "active" : ""}" data-test-name="${testName}">${isEditing ? "閉じる" : "修正"}</button>
        </div>
        ${bodyHtml}
      `;
      testsListEl.appendChild(card);
    });

    if (isHS) {
      const mockExams = currentData.mockExams || [];
      const mockHtml = `
        <p class="section-title">模試の成績表</p>
        <div class="card">
          ${mockExams.map((m) => {
            const statusHtml = m.filled
              ? `<span class="badge done">提出済み(${formatDate(m.submittedAt)})</span>`
              : `<span class="badge pending">未提出</span>`;
            const linksHtml = m.filled
              ? `<div class="mock-exam-links">${m.photos.map((p) => `<a href="${p.url}" target="_blank" rel="noopener">写真${p.photoIndex}</a>`).join("")}</div>`
              : "";
            return `<div class="mock-exam-slot"><span class="mock-exam-name">${m.slotKey}</span><div class="mock-exam-meta">${statusHtml}${linksHtml}</div></div>`;
          }).join("")}
          <p class="field-note" style="margin:8px 0 0;">模試の提出はお子様のアプリから行います</p>
        </div>
      `;
      testsListEl.parentElement.insertAdjacentHTML("beforeend", mockHtml);
    }
    document.querySelectorAll(".test-edit-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const testName = btn.dataset.testName;
        editingTestName = editingTestName === testName ? null : testName;
        renderGrades(document.getElementById("tab-content"));
      });
    });
    document.querySelectorAll(".photo-input").forEach((input) => input.addEventListener("change", (e) => handlePhotoSelected(e, input.dataset.testName)));
    const editForm = document.getElementById("edit-form");
    if (editForm) editForm.addEventListener("submit", handleAddScore);
    drawNaishin();
  }

  // ---------- 内申点(中学生のみ。閲覧+「修正」で入力・修正) ----------
  function naishinFmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }
  function naishinCalc(ratings) {
    let total = 0, count = 0;
    NAISHIN_MAIN.forEach((s) => { const r = Number(ratings[s]); if (r >= 1 && r <= 5) { total += r * 4; count++; } });
    NAISHIN_SUB.forEach((s) => { const r = Number(ratings[s]); if (r >= 1 && r <= 5) { total += r * 7.5; count++; } });
    return { total, complete: count === NAISHIN_MAIN.length + NAISHIN_SUB.length };
  }
  function drawNaishin() {
    const el = document.getElementById("naishin-section");
    if (!el) return;
    const nd = (currentData && currentData.naishin) || { terms: [] };
    const saved = nd.terms.find((t) => t.term === naishinTerm) || { ratings: {} };
    const ratings = saved.ratings || {};
    const hasData = Object.values(ratings).some((v) => v !== null && v !== undefined);
    const tabs = NAISHIN_TERMS.map((term) => {
      const t = nd.terms.find((x) => x.term === term);
      const sub = t && t.total !== null && t.total !== undefined ? `${naishinFmt(t.total)}点` : "未入力";
      return `<button type="button" class="naishin-tab ${term === naishinTerm ? "active" : ""}" data-term="${term}">${term}<br><span>${sub}</span></button>`;
    }).join("");

    let bodyHtml;
    if (!editingNaishin) {
      const viewRow = (s) => ratings[s] !== null && ratings[s] !== undefined
        ? `<div class="entry"><div>${s}</div><div>${ratings[s]}</div></div>` : "";
      const c = naishinCalc(ratings);
      bodyHtml = hasData ? `
        <div class="naishin-total"><span>${naishinTerm}の内申点<br><span style="font-size:11px;font-weight:500;color:var(--muted)">${c.complete ? "" : "未入力の教科があります"}</span></span><span><strong>${naishinFmt(c.total)}</strong> / 250</span></div>

    } else {

        <p class="naishin-group">副教科(×7.5)</p>${NAISHIN_SUB.map(row).join("")}

          <button type="button" class="test-edit-btn ${editingNaishin ? "active" : ""}" id="naishin-edit-btn">${editingNaishin ? "閉じる" : "修正"}</button>
        </div>
        <p class="field-note" style="margin:0;">通知表の5段階評価から自動で計算します。主要5教科は×4、副教科は×7.5で、オール5なら250点満点です。</p>

    const readRatings = () => {
      const r = {};
      el.querySelectorAll("select[data-ns]").forEach((sel) => { r[sel.dataset.ns] = sel.value === "" ? null : Number(sel.value); });
      return r;
    };
    const updateTotal = () => {
      const cur = readRatings();
      const c = naishinCalc(cur);
      const any = Object.values(cur).some((v) => v !== null);
      document.getElementById("naishin-total-value").textContent = any ? naishinFmt(c.total) : "-";
      document.getElementById("naishin-incomplete").textContent = any && !c.complete ? "未入力の教科があります" : "";
    };
    el.querySelectorAll("select[data-ns]").forEach((sel) => sel.addEventListener("change", updateTotal));
    document.getElementById("naishin-save-btn").addEventListener("click", async () => {
      const btn = document.getElementById("naishin-save-btn");
      const errorEl = document.getElementById("naishin-error");
      errorEl.classList.remove("show");
      const newRatings = readRatings();
      if (!Object.values(newRatings).some((v) => v !== null)) return showFieldError(errorEl, "評価を1つ以上入力してください");
      btn.disabled = true; btn.textContent = "保存中...";
      try {
        const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "saveNaishin", parentId, sid: currentSid, term: naishinTerm, ratings: newRatings }) });
        const result = await res.json();
        if (!result.ok) throw new Error(result.error || "failed");
        if (!currentData.naishin) currentData.naishin = { terms: NAISHIN_TERMS.map((t) => ({ term: t, ratings: {}, total: null, complete: false })), max: 250 };
        const c = naishinCalc(newRatings);
        const idx = currentData.naishin.terms.findIndex((t) => t.term === naishinTerm);
        const entry = { term: naishinTerm, ratings: newRatings, total: c.total, complete: c.complete };
        if (idx === -1) currentData.naishin.terms.push(entry); else currentData.naishin.terms[idx] = entry;
        editingNaishin = false;
        drawNaishin();
        showToast("内申点を保存しました");
      } catch (err) {
        showFieldError(errorEl, err.message || "保存に失敗しました。もう一度お試しください。");
        btn.disabled = false; btn.textContent = `${naishinTerm}の内申点を保存する`;
      }
    });
    updateTotal();
  }

  function renderEditForm(testName, t, isHS, subjectNames) {
    const isES = !!(currentData && currentData.isElementary);
    const gradeSubjects = isES ? ES_SUBJECTS : SUBJECTS;
    const subjectOf = (key) => (t ? t.subjects.find((s) => s.subject === key) : null);
    let subjectGridHtml = "";
    if (isHS) {
      HS_SUBJECT_GROUPS.forEach((group) => {
        subjectGridHtml += `<p class="hs-group-title">${group}</p>`;
        for (let i = 1; i <= HS_SLOTS_PER_SUBJECT; i++) {
          const slotKey = group + i;
          const existing = subjectOf(slotKey);
          const displayName = subjectNames[slotKey] || `未設定${i}`;
          subjectGridHtml += `
            <div class="subject-row">
              <div class="hs-slot-label"><span class="hs-slot-name">${escapeHtml(displayName)}</span></div>
              <div class="target-cell"><input type="number" inputmode="numeric" min="0" max="100" data-subject="${slotKey}" data-field="target" value="${existing && existing.target !== null ? existing.target : ""}" /></div>
              <input type="number" inputmode="numeric" min="0" max="100" data-subject="${slotKey}" data-field="score" value="${existing && existing.score !== null ? existing.score : ""}" />
              <input type="number" inputmode="numeric" min="0" max="100" data-subject="${slotKey}" data-field="average" value="${existing && existing.average !== null ? existing.average : ""}" />
            </div>
          `;
        }
      });
    } else {
      subjectGridHtml = gradeSubjects.map((s) => {

        <div class="subject-row">
          <label>${s}</label>
          <div class="target-cell"><input type="number" inputmode="numeric" min="0" max="100" data-subject="${s}" data-field="target" value="${existing && existing.target !== null ? existing.target : ""}" /></div>

  function showFieldError(el, msg) { el.textContent = msg; el.classList.add("show"); }

  function mergeTestScoresLocally(testName, submittedSubjects) {
    currentData.tests = currentData.tests || [];
    const isHS = !!currentData.isHighSchool;
    const subjectKeys = isHS ? HS_SLOT_KEYS : SUBJECTS;
    let test = currentData.tests.find((t) => t.testName === testName);
    if (!test) {
      test = { testName, subjects: subjectKeys.map((s) => ({ subject: s, score: null, average: null, target: null })) };
      currentData.tests.push(test);
    }
    submittedSubjects.forEach((sub) => {
      const entry = test.subjects.find((s) => s.subject === sub.subject);
      if (!entry) return;
      if (sub.score !== null) entry.score = sub.score;
      if (sub.average !== null) entry.average = sub.average;
      if (sub.target !== null) entry.target = sub.target;
    });
  }

  async function handleAddScore(e) {
    e.preventDefault();
    const form = e.target;
    const testName = form.dataset.testName;
    const errorEl = document.getElementById("form-error");
    const btn = document.getElementById("submit-btn");
    errorEl.classList.remove("show");

    const isHS = !!(currentData && currentData.isHighSchool);
    const isES = !!(currentData && currentData.isElementary);
    const subjectKeys = isHS ? HS_SLOT_KEYS : (isES ? ES_SUBJECTS : SUBJECTS);

    const subjects = []; let validationError = "";
    subjectKeys.forEach((subjectKey) => {
      if (validationError) return;
      const scoreInput = form.querySelector(`input[data-subject="${subjectKey}"][data-field="score"]`);
      const avgInput = form.querySelector(`input[data-subject="${subjectKey}"][data-field="average"]`);
      const targetInput = form.querySelector(`input[data-subject="${subjectKey}"][data-field="target"]`);
      const scoreRaw = scoreInput.value, avgRaw = avgInput.value, targetRaw = targetInput.value;
      if (scoreRaw === "" && avgRaw === "" && targetRaw === "") return;
      const parseOrError = (raw, label) => {
        if (raw === "") return null;
        const n = Number(raw);
        if (Number.isNaN(n) || n < 0 || n > 100) { validationError = `${label}は0〜100の数字で入力してください`; return null; }
        return n;
      };
      const target = parseOrError(targetRaw, "目標点"); if (validationError) return;
      const score = parseOrError(scoreRaw, "点数"); if (validationError) return;
      const average = parseOrError(avgRaw, "平均点"); if (validationError) return;
      if (target !== null) {
        const prev = getPreviousScore(subjectKey, testName);
        if (prev !== null && target < prev) { validationError = `目標点は、前回の点数(${prev}点)以上にしよう`; return; }
      }
      subjects.push({ subject: subjectKey, score, average, target });
    });
    if (validationError) return showFieldError(errorEl, validationError);
    if (subjects.length === 0) return showFieldError(errorEl, "少なくとも1科目は入力してください");

    btn.disabled = true; btn.textContent = "保存中...";
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "addTestScores", parentId, sid: currentSid, testName, subjects }) });
      const result = await res.json();
      if (!result.ok) throw new Error(result.error || "failed");
      mergeTestScoresLocally(testName, subjects);
      editingTestName = null;
      renderGrades(document.getElementById("tab-content"));
      showToast("記録しました");
    } catch (err) {
      showFieldError(errorEl, err.message || "保存に失敗しました。もう一度お試しください。");
      btn.disabled = false; btn.textContent = "この内容で保存する";
    }
  }

  function compressImage(file, maxWidth = 1600, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width * scale; canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
        };
        img.onerror = reject; img.src = reader.result;
      };
      reader.onerror = reject; reader.readAsDataURL(file);
    });
  }
  async function handlePhotoSelected(e, testName) {

      if (!test) { test = { testName, subjects: subjectKeys.map((s) => ({ subject: s, score: null, average: null, target: null })) }; currentData.tests.push(test); }
      test.photo = { submittedAt: result.submittedAt, driveFileUrl: result.url };

    } catch (err) { showToast("成績表のアップロードに失敗しました。もう一度お試しください。"); label.childNodes[0].textContent = originalText; }
  }

  function renderYearSchedule(el) {
    const today = yearTodayStr();
    const ms = YEAR_SCHEDULE.months;
    // 月ごとに、曜日別の「第○回」を数える
    const blocks = ms.map((mo) => {
      const cnt = {};
      const cells = mo.c.map(([date, k, h]) => {
        const dt = new Date(Number(date.slice(0, 4)), Number(date.slice(5, 7)) - 1, Number(date.slice(8, 10)));
        const dow = dt.getDay();
        let nth = 0;
        if (k === "L") { cnt[dow] = (cnt[dow] || 0) + 1; nth = cnt[dow]; }
        return { date, k, h, dow, nth, cm: Number(date.slice(5, 7)) };
      });
      return { m: mo.m, y: mo.y, cells, first: cells[0].date, last: cells[cells.length - 1].date };
    });
    let curIdx = blocks.findIndex((b) => today >= b.first && today <= b.last);
    if (curIdx < 0) curIdx = today < blocks[0].first ? 0 : blocks.length - 1;

    // 画面の上に固定して、どこまでスクロールしても「戻る」と月の移動ができるようにする

      html += `<div class="card year-card" id="year-block-${bi}">

  function renderSchedule(el) {

  // 保存された志望校データ → カレンダー用の予定 [{d, t:"ex"|"rs", txt, who}]

  function ucRenderCalendar(el, opts) {
    const personal = opts.personal || [];
    if (ucCal.month == null) ucCal.month = ucDefaultMonth(personal);
    if (ucCal.view == null) ucCal.view = (opts.personalTab && personal.length) ? "mine" : "univ";
    if (!opts.personalTab) ucCal.view = "univ";
    const showUniv = ucCal.view === "univ";
    const m = ucCal.month;
    const first = new Date(UC_YEAR, m - 1, 1), days = new Date(UC_YEAR, m, 0).getDate();
    const t = new Date(); const todayMd = t.getFullYear() === UC_YEAR ? `${t.getMonth() + 1}/${t.getDate()}` : "";
    const univIdx = {};
    if (showUniv) {
      UC_R.forEach((r) => {
        if (ucCal.univ !== "all" && r.k !== ucCal.univ) return;
        r.ex.forEach((d) => { (univIdx[d] ||= { ex: new Set(), rs: new Set() }).ex.add(r.k); });
        if (r.res) (univIdx[r.res] ||= { ex: new Set(), rs: new Set() }).rs.add(r.k);
      });
    }
    const label = (e) => opts.showNames ? String(e.who || "").split(/[\s　]+/)[0] : e.univ; // 講師用は名字だけ（くわしくは下の一覧）
    let cells = "";
    for (let i = 0; i < first.getDay(); i++) cells += `<div class="uc-day empty" aria-hidden="true"></div>`;
    for (let d = 1; d <= days; d++) {
      const key = `${m}/${d}`, w = new Date(UC_YEAR, m - 1, d).getDay();
      const lines = [];
      if (UC_SPECIAL[key]) lines.push(`<span class="uc-l ct">${UC_SPECIAL[key]}</span>`);
      personal.filter((e) => e.d === key).forEach((e) => lines.push(`<span class="uc-l me ${e.t === "rs" ? "rs" : ""}">${ucEsc(label(e))}</span>`));
      if (showUniv && univIdx[key]) {
        UC_U.forEach((u) => { if (univIdx[key].ex.has(u.key)) lines.push(`<span class="uc-l">${u.short}</span>`); });
        UC_U.forEach((u) => { if (univIdx[key].rs.has(u.key)) lines.push(`<span class="uc-l rs">${u.short}</span>`); });
      }
      const MAX = 6;
      const shown = lines.length > MAX ? lines.slice(0, MAX - 1).concat(`<span class="uc-l more">ほか${lines.length - MAX + 1}</span>`) : lines;
      cells += `<button type="button" class="uc-day${(w === 0 || w === 6 || UC_HOL[key]) ? " wk" : ""}${ucCal.day === key ? " sel" : ""}${todayMd === key ? " today" : ""}" data-ucday="${key}" aria-label="${m}月${d}日"><span class="uc-dn">${d}</span>${shown.join("")}</button>`;
    }
    el.innerHTML = `
      ${opts.headHtml || ""}
      <div class="uc-legend"><span><b>黒字</b>＝入試日</span><span class="rs"><b>赤字</b>＝合格発表日</span>${opts.personalTab ? `<span>★＝${ucEsc(opts.personalTab.replace(/の受験予定$/, ""))}</span>` : ""}<span>※＝要項で確認</span></div>
      ${opts.personalTab ? `<div class="uc-seg"><button type="button" data-ucview="mine" class="${ucCal.view === "mine" ? "on" : ""}">${ucEsc(opts.personalTab)}</button><button type="button" data-ucview="univ" class="${ucCal.view === "univ" ? "on" : ""}">大学の日程も表示</button></div>` : ""}
      <div class="uc-seg">${[1, 2, 3].map((mm) => `<button type="button" data-ucmonth="${mm}" class="${mm === m ? "on" : ""}">${UC_YEAR}年${mm}月</button>`).join("")}</div>
      ${showUniv ? `<div class="uc-filter"><select id="uc-univ-filter" aria-label="大学で絞り込む"><option value="all">すべての大学（${UC_U.length}校）</option>${UC_U.map((u) => `<option value="${u.key}" ${ucCal.univ === u.key ? "selected" : ""}>${u.name}</option>`).join("")}</select></div>` : ""}
      <div class="uc-grid">${UC_DOW.split("").map((w) => `<div class="uc-dow">${w}</div>`).join("")}${cells}</div>
      <div class="card uc-detail" id="uc-detail">${ucDetailHtml(personal, opts, showUniv)}</div>
      <p class="uc-note">出典：各大学の入試ガイド・学生募集要項、ベネッセ「マナビジョン」、旺文社「パスナビ」（2026年11月時点）。日程は変更されることがあります。出願前に必ず各大学の募集要項で確認してください。</p>
    `;
    const rerender = () => ucRenderCalendar(el, opts);
    el.querySelectorAll("[data-ucday]").forEach((b) => b.addEventListener("click", () => { ucCal.day = b.dataset.ucday; rerender(); const det = document.getElementById("uc-detail"); if (det) det.scrollIntoView({ behavior: "smooth", block: "start" }); }));
    el.querySelectorAll("[data-ucmonth]").forEach((b) => b.addEventListener("click", () => { ucCal.month = Number(b.dataset.ucmonth); ucCal.day = null; rerender(); }));
    el.querySelectorAll("[data-ucview]").forEach((b) => b.addEventListener("click", () => { ucCal.view = b.dataset.ucview; rerender(); }));
    const f = document.getElementById("uc-univ-filter");
    if (f) f.addEventListener("change", (e) => { ucCal.univ = e.target.value; rerender(); });
    if (opts.afterRender) opts.afterRender(el);
  }
  function ucDetailHtml(personal, opts, showUniv) {
    const key = ucCal.day;
    if (!key) {
      if (opts.personalTab && personal.length) {
        const rows = personal.filter((e) => Number(e.d.split("/")[0]) === ucCal.month);
        return `<h3>${ucCal.month}月の${ucEsc(opts.personalTab)}</h3>${rows.length ? rows.map((e) => `<div class="uc-plan-row ${e.t === "rs" ? "rs" : ""}"><span class="d">${e.d}（${ucWd(e.d)}）</span><span>${opts.showNames ? `<b>${ucEsc(e.who)}</b> ` : ""}${ucEsc(e.txt)}</span></div>`).join("") : `<p class="uc-sub">この月の予定はありません。</p>`}<p class="uc-sub" style="margin-top:8px;">日付をタップすると、その日の詳しい内容が出ます。</p>`;
      }
      return `<h3>日付をタップしてください</h3><p class="uc-sub">その日に入試や合格発表がある大学・学部・方式が出ます。</p>`;
    }
    const [mm, dd] = key.split("/");
    let html = `<h3>${mm}月${dd}日（${ucWd(key)}）${UC_HOL[key] ? ` <span class="uc-sub">${UC_HOL[key]}</span>` : ""}</h3>`;
    if (UC_SPECIAL[key]) html += `<p class="uc-sub">${UC_SPECIAL[key] === "共テ本試" ? "大学入学共通テスト 本試験（1/16・1/17）" : "共通テスト 追試験（1/23・1/24）"}</p>`;
    const mine = personal.filter((e) => e.d === key);
    if (mine.length) {
      html += `<p class="uc-sec-h">${ucEsc(opts.personalTab || "受験予定")}</p>` + mine.map((e) => `<div class="uc-item ${e.t === "rs" ? "uc-red" : ""}">${opts.showNames ? `<b>${ucEsc(e.who)}</b> ` : "★ "}${ucEsc(e.txt)}${e.rank ? `<span class="uc-fac">${ucEsc(e.rank)}志望</span>` : ""}</div>`).join("");
    }
    if (showUniv) {
      const pick = (fn) => UC_R.filter((r) => (ucCal.univ === "all" || r.k === ucCal.univ) && fn(r));
      const ex = pick((r) => r.ex.includes(key)), rs = pick((r) => r.res === key);
      const block = (rows, isRs) => UC_U.filter((u) => rows.some((r) => r.k === u.key)).map((u) => `<div class="uc-item"><b class="${isRs ? "uc-red" : ""}">${u.name}</b>${rows.filter((r) => r.k === u.key).map((r) => `<div>${ucEsc(r.method)}${r.chk ? " ※" : ""}${isRs ? (r.ex.length ? `（試験日 ${r.ex.join("・")}）` : "") : (r.res ? `（発表 ${r.res}）` : "")}<span class="uc-fac">${ucEsc(r.fac)}${r.note ? "｜" + ucEsc(r.note) : ""}</span></div>`).join("")}</div>`).join("");
      if (ex.length) html += `<p class="uc-sec-h">入試</p>${block(ex, false)}`;
      if (rs.length) html += `<p class="uc-sec-h rs">合格発表</p>${block(rs, true)}`;
      if (!ex.length && !rs.length && !mine.length && !UC_SPECIAL[key]) html += `<p class="uc-sub">この日の入試・合格発表はありません。</p>`;
    } else if (!mine.length && !UC_SPECIAL[key]) {
      html += `<p class="uc-sub">この日の予定はありません。「大学の日程も表示」に切り替えると、全大学の日程が見られます。</p>`;
    }
    return html;
  }

  // ---------- 保護者アプリ：大学入試カレンダー（高校生の保護者のみ） ----------
  async function renderUnivCalendarParent(el) {
    el.innerHTML = `<p class="empty">読み込み中...</p>`;
    let shibo = null;
    try { const d = await ucPost({ action: "getShibo", parentId, sid: currentSid }); if (d.ok) shibo = d; } catch (err) {}
    if (currentTab !== "unical") return;
    const data = shibo && shibo.latest ? shibo.latest.data : null;
    const name = currentData.studentName;
    const personal = ucEventsFromShibo(data, name);
    ucCal.day = null; ucCal.view = null; ucCal.month = null;
    ucRenderCalendar(el, {
      personal, personalTab: `${name}さんの受験予定`,
      headHtml: `<div class="card"><p class="section-title" style="margin-top:0;">${ucEsc(name)}さんの志望校</p>${ucShiboSummaryHtml(data)}${shibo && shibo.latest && shibo.latest.savedAtLabel ? `<p class="uc-sub" style="margin:8px 0 0;">最終更新：${ucEsc(shibo.latest.savedAtLabel)}（お子様が生徒用アプリで登録しています）</p>` : `<p class="uc-sub" style="margin:8px 0 0;">お子様が生徒用アプリの「志望校入力」で登録すると、ここに表示されます。</p>`}</div>`,
    });
  }
</script>
